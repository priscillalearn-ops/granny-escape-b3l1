<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>閱讀守城</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700;800&family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：單欄。上方是戰場畫布（城堡在左，敵人沿小路從右邊走來），下方是題目板。
   畫風：繪本式平塗＋墨線，冷調石牆與暮色天空，赭黃旗幟點綴。整頁固定深色石板底。 */
:root{
  --page:#1f2a30; --page2:#283740; --panel:#eef0ea; --panel2:#e0e5dd; --ink:#1c2428; --muted:#5d686b; --line:#c3cbc2;
  --ochre:#c9932e; --ochreD:#9c6f1c; --moss:#4f7a4a; --brick:#a8463a; --steel:#2f4a5e; --steelD:#1d3240;
  --onDark:#e9ece4; --onDarkMuted:#a3b0ae;
  --display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --latin:"Alegreya",Georgia,"Times New Roman",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--page);color:var(--onDark);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}
.latin{font-family:var(--latin)}
.ipa{font-family:"Charis SIL","Doulos SIL","Lucida Sans Unicode","Arial Unicode MS",sans-serif;font-size:.85em;color:var(--muted);font-weight:400}

/* 標題 */
.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 18px;border-bottom:1px solid #ffffff1f;padding-bottom:14px}
.brand h1{font-family:var(--display);font-weight:900;font-size:36px;letter-spacing:.12em;margin:0;line-height:1.1}
.brand .en{font-family:var(--latin);font-weight:700;font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--ochre);display:block;margin-bottom:4px}
.brand p{margin:0;color:var(--onDarkMuted);font-size:14px}

/* 按鈕 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:8px;font-weight:700;background:var(--steel);color:var(--onDark);box-shadow:inset 0 -3px 0 var(--steelD);min-height:46px}
.btn:active{transform:translateY(2px);box-shadow:inset 0 -1px 0 var(--steelD)}
.btn.gold{background:var(--ochre);color:#1c1608;box-shadow:inset 0 -3px 0 var(--ochreD)}
.btn.alt{background:var(--panel2);color:var(--ink);box-shadow:inset 0 -3px 0 var(--line)}
.btn.quiet{background:transparent;color:var(--onDark);box-shadow:inset 0 0 0 1.5px #ffffff33}
.btn svg{width:18px;height:18px;flex:none}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > .btn{flex:1 1 150px}
.full{width:100%}

/* 地圖：關卡卡片 */
.stages{display:grid;gap:16px}
.stage{background:var(--panel);color:var(--ink);border-radius:10px;overflow:hidden;box-shadow:0 1px 0 #ffffff14,0 10px 24px #0000004d}
.stage canvas{display:block;width:100%;height:auto;aspect-ratio:var(--ar,720/300)}
.stage .body{padding:14px 16px 16px;display:grid;gap:10px}
.stage .head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.stage h2{font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:.06em;margin:0}
.stage .no{font-family:var(--latin);font-weight:700;color:var(--muted);font-size:14px;letter-spacing:.1em}
.weeks{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.wk{padding:8px 16px;border-radius:999px;font-weight:700;box-shadow:inset 0 0 0 1.5px #ffffff33;color:var(--onDark)}
.wk.on{background:var(--ochre);color:#1c1608;box-shadow:none}
.parts{display:grid}
.part{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.part:last-child{border-bottom:1px solid var(--line)}
.part .stars svg{width:16px;height:16px;vertical-align:-2px}
.btn.sm{min-height:40px;padding:6px 14px;font-size:15px}
.pill{font-family:var(--latin);font-weight:700;font-size:14px;border:1.5px solid var(--line);border-radius:4px;padding:0 8px;color:var(--steel)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:14px;flex-wrap:wrap}
.stars{display:inline-flex;gap:2px}
.stars svg{width:18px;height:18px}
.stage.locked canvas{filter:grayscale(1) brightness(.6)}
.stage.locked .body{color:var(--muted)}
.lockline{display:flex;align-items:center;gap:8px;font-size:14px}
.lockline svg{width:16px;height:16px}
.foot{margin-top:18px;font-size:13px;color:var(--onDarkMuted);text-align:center}

/* 戰場 */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.topbar b{font-family:var(--display);font-weight:900;letter-spacing:.08em;font-size:18px}
.tbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:8px;box-shadow:inset 0 0 0 1.5px #ffffff2e;font-weight:700;font-size:14px;min-height:40px}
.tbtn svg{width:16px;height:16px}
.field{position:relative;border-radius:10px;overflow:hidden;box-shadow:0 10px 24px #0000004d}
#cv{display:block;width:100%;height:auto;aspect-ratio:var(--ar,720/300);touch-action:manipulation}
.hud{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:10px 2px 12px;font-size:14px;color:var(--onDarkMuted);flex-wrap:wrap}
.hud .grp{display:flex;align-items:center;gap:8px}
.pips{display:inline-flex;gap:3px}
.pips svg{width:17px;height:17px}
.num{font-variant-numeric:lining-nums tabular-nums;color:var(--onDark);font-weight:700}

/* 題目板 */
.qp{background:var(--panel);color:var(--ink);border-radius:10px;padding:14px 16px 16px;min-height:236px}
.qlabel{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.12em}
.prompt{margin:4px 0 2px;word-break:break-word}
.prompt.w{font-family:var(--latin);font-weight:800;font-size:38px;line-height:1.15}
.prompt.zh{font-family:var(--display);font-weight:900;font-size:30px;letter-spacing:.04em}
.prompt.sent{font-family:var(--latin);font-weight:700;font-size:23px;line-height:1.45}
.pos{font-family:var(--latin);font-size:16px;color:var(--muted);font-weight:500;margin-left:8px;letter-spacing:0}
.blank{display:inline-block;min-width:88px;border-bottom:2.5px solid var(--ochre);margin:0 4px;transform:translateY(-4px)}
.trans{color:var(--muted);font-size:15px}
.say{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--steel);padding:6px 10px;border-radius:6px;box-shadow:inset 0 0 0 1.5px var(--line)}
.say svg{width:16px;height:16px}
.bigsay{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px auto 2px;padding:14px 22px;border-radius:10px;background:var(--panel2);color:var(--steel);font-weight:700;box-shadow:inset 0 -3px 0 var(--line)}
.bigsay svg{width:28px;height:28px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.opt{background:var(--panel2);border:1.5px solid var(--line);border-radius:8px;padding:10px;font-size:19px;font-weight:700;min-height:56px;color:var(--ink);word-break:break-word;position:relative}
.opt.latin{font-size:22px;font-weight:700}
.opt .k{position:absolute;left:8px;top:4px;font-family:var(--latin);font-size:12px;color:var(--muted);font-weight:700}
.opt:hover:not(:disabled){border-color:var(--steel)}
.opt.ok{background:var(--moss);border-color:var(--moss);color:#fff}
.opt.no{background:var(--brick);border-color:var(--brick);color:#fff}
.opt.ok .k,.opt.no .k{color:#ffffffaa}
.opt:disabled{cursor:default}
.fb{margin-top:10px;font-size:15px;min-height:1.6em}
.fb b{font-family:var(--latin);font-size:19px}
.fb .good{color:var(--moss);font-weight:700}
.fb .bad{color:var(--brick);font-weight:700}
.wait{display:grid;place-items:center;min-height:200px;text-align:center;color:var(--muted)}
.wait b{font-family:var(--display);font-size:20px;color:var(--ink);letter-spacing:.08em}

/* 清單、結果 */
.sheet{background:var(--panel);color:var(--ink);border-radius:10px;padding:6px 16px;margin-bottom:14px}
.sheet h3{font-family:var(--display);font-weight:900;letter-spacing:.06em;font-size:17px;margin:10px 0 2px}
.word{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.word:last-child{border-bottom:0}
.word .en{font-family:var(--latin);font-weight:800;font-size:23px}
.word .zh{font-weight:700}
.word .ex{font-family:var(--latin);font-size:16px;color:#3c474b}
.word .exz{font-size:14px;color:var(--muted)}
.word .cnt{font-size:13px;color:var(--brick);font-weight:700;margin-left:6px}
.result{background:var(--panel);color:var(--ink);border-radius:10px;overflow:hidden;margin-bottom:14px}
.result canvas{display:block;width:100%;height:auto;aspect-ratio:var(--ar,720/300)}
.result .body{padding:16px;text-align:center}
.result h2{font-family:var(--display);font-weight:900;font-size:28px;letter-spacing:.12em;margin:0}
.result .stars svg{width:30px;height:30px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stats div{background:var(--panel2);border-radius:8px;padding:8px 4px}
.stats .n{font-family:var(--latin);font-weight:800;font-size:28px;line-height:1.1;font-variant-numeric:lining-nums tabular-nums}
.stats .l{font-size:13px;color:var(--muted)}
.lead{color:var(--onDarkMuted);font-size:15px;margin:0 0 12px}
.help p{margin:12px 0}
.help b{font-family:var(--display)}
.modal{position:fixed;inset:0;background:#0b1013b3;display:grid;place-items:center;padding:16px;z-index:20}
.modal .box{background:var(--panel);color:var(--ink);border-radius:10px;padding:18px;max-width:360px;width:100%}
.modal p{margin:0 0 14px;font-weight:700}
.prompt.sent.long{font-size:19px}
.prompt.scr{letter-spacing:.18em;color:var(--steel)}
.hl{color:var(--brick);text-decoration:underline;text-underline-offset:3px}
.opts.long{grid-template-columns:1fr}
.opts.long .opt{font-size:16px;text-align:left;padding:10px 12px 10px 28px;min-height:48px;font-weight:600}
.opts.long .opt .k{top:10px}
.psg{background:#fff;border:1.5px solid var(--line);border-radius:8px;margin:6px 0 10px;color:var(--ink)}
.psg summary{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;font-family:var(--latin);font-weight:800;font-size:17px;color:var(--steel)}
.psg summary svg{width:18px;height:18px;flex:none}
.psg .ptext{max-height:190px;overflow:auto;padding:0 12px 6px;font-family:var(--latin);font-size:17px;line-height:1.5;border-top:1px solid var(--line)}
.sheet .psg .ptext{max-height:none}
.psg .ptext p{margin:8px 0}
.notes ul{margin:4px 0 12px;padding-left:20px}
.notes li{margin:6px 0}
.ans{font-size:13px;color:var(--muted)}
@media (max-width:420px){ .prompt.w{font-size:32px} .opt.latin{font-size:20px} .brand h1{font-size:30px} }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="modal" id="modal" hidden><div class="box"><p id="modalMsg"></p><div class="row"><button class="btn alt" id="modalNo">取消</button><button class="btn" id="modalYes">確定</button></div></div></div>

<script>
/* =========================================================
   給老師／維護者：題庫在這裡。
   TABS 是上方的分頁（Cycle 3、Cycle 4、期末總複習），每個分頁有幾個單元（units）。
   單元裡的題目有三種寫法：
     W(...)   單字卡：w 英文、pos 詞性、zh 中文、def 英文定義（講義原文）、ex 例句（講義原文）
              → 遊戲會自動出「看定義選字、看字選定義、聽發音、例句填空、字母重組」
     fill(box, [[句子（空格寫 ___）, 答案], ...])  → 從 box 裡抽另外 3 個字當誘答
     mc(題目, 正解, [誘答...], 文章代號)            → 選擇題（正解寫第一個，畫面上會打亂）
     tf([[敘述, true/false], ...], 文章代號)       → True / False
   文章放在 P 裡，題目寫上文章代號，作答時會在題目上方顯示文章。
   題目與答案依照《Reading Workbook Grade 3 Pink Book Cycles 3-4 & Final Exam Review》Answer Key。
   ========================================================= */
const P = {
  preserve:{ t:'To Protect or Not to Protect?', x:`Today the United States has hundreds of national parks, monuments, and landmarks. Animals and plants live in them. Visitors enjoy them. Scientists learn from them. The rules protect them. But are there too many rules? Not everyone agrees.

[Sidebar] Is It a Park or a Monument?
A United States national monument is a protected area. It is like a national park, but easier to create. Monuments and parks are different in other important ways.
National Parks: are large natural places with many different natural features; aim to protect many different aspects of nature.
National Monuments: often focus on protecting one specific natural resource, landmark, or structure that has historic or scientific interest; receive less money and less wildlife protection than parks.` },
  dolphin:{ t:'Dolphins', x:`Dolphins are good learners. They learn to play games. They learn to do tricks. Trainers have taught dolphins how to save lives. One trainer even taught his dolphins to clean out their tank. For each piece of trash they brought him, he gave them a fish.` },
  zoo:{ t:'America’s First Zoo', x:`The first U.S. zoo opened in Philadelphia in 1874. Visitors were thrilled to see animals from all over the world. The zoo had six giraffes, an elephant named Jennie, and many colorful birds. It also had some animals from Australia. People were amazed at the kangaroos, wombats, and dingoes.` },
  rushmore:{ t:'Mount Rushmore', x:`Mount Rushmore is a huge carving in a stone cliff. The carving shows the faces of four U.S. presidents. They are George Washington, Thomas Jefferson, Theodore Roosevelt, and Abraham Lincoln. Mount Rushmore is in South Dakota. Each year many people visit this amazing sight.` },
  sports:{ t:'Kids Love Sports', x:`There are age-appropriate programs for almost every sport, and playing sports is a way for kids to challenge themselves in a safe and encouraging environment. Sports are a natural place to learn important life lessons, and participating in sports can pave the way to unique opportunities that kids might not otherwise have. Over time, as with many group activities, teammates and coaches become like family, so kids that are involved in sports have larger support systems. Sports are also a very viable way for athletic kids to be able to afford college. Many college and universities offer sports scholarships.` },
  exercise:{ t:'Reasons for Exercise', x:`There are many excellent reasons for exercising several times each week. First, people who exercise look better. Exercise is important to keep our bodies in good shape. In addition, people who exercise have more energy. For example, a person who exercises can walk upstairs or climb hills more easily. People who exercise have a healthier heart, too. Finally, exercise reduces stress and helps you have a clear mind. Too much stress can cause you to worry a lot, and that is not good for your health. For these reasons, if you want to improve your health, you should exercise regularly.` },
  rock:{ t:'Independence Rock — A Historic Site on the Oregon Trail', x:`In the 1800s, many people in the United States moved to the West to start a new life. These people were called pioneers. The pioneers traveled on the long, rocky Oregon Trail.

Around 1812, some pioneers stopped at a very big rock located on the Oregon Trail. The rock was so massive that they were able to see it from far away. They carved their names on the rock.

In 1830, someone named the rock Independence Rock. The rock became a famous landmark for pioneers. Soon, 5,000 names covered it.

Today, Independence Rock is a historic site. Visitors can see the names on the rock. They can walk on the Oregon Trail.

[Picture A: a map]  [Caption B] The map shows the Oregon Trail and the location of Independence Rock.

Visit Our Historical Sites
People should visit Independence Rock and other historical sites. Some people think they can just read about these places. But reading is not enough.

They should experience the massive size of the rock. They should touch and see the carved names of the pioneers up close. They should walk on the rocky Oregon Trail. When people visit a historical site, they get more than information. They experience an important part of our history.

[Box C] Independence Rock is often called the “Register of the Desert” because so many pioneers carved their names on it. The rock is about 130 feet tall and nearly a mile around.` },
  census:{ t:'What Is a Census?', x:`What is a census? A census is a count. Every ten years the U.S. Census Bureau counts people. It also finds out where people live, the kind of work they do, and other facts. The census tells whether the population of a state changes. The number of representatives a state has in Congress depends on its population. Census numbers are helpful in planning new roads, schools, and other things.` },
  bees:{ t:'Bees', x:`An average bee hive consists of about 20,000 bees. Within the colony, there are three types of bees, each with its own important job. There is only one queen bee in the hive, and her only job is to fill the hive with eggs. A queen will lay about 1,500 eggs a day. Male bees are called drones. Their only job is to mate with the queen. Worker bees, on the other hand, are extremely busy. They are female bees that lay no eggs. Worker bees tend the hive by taking care of the babies, building honeycombs, and keeping the hive cool. Some worker bees also leave the hive to go collect nectar and pollen.` },
  leap:{ t:'One Giant Leap', x:`(1) On April 12, 1961, Russian cosmonaut Yuri Gagarin became the first man to travel into space. Just 23 days later, American astronaut Alan Shepard followed. Both flights were short, but they proved that people could go into space.

(2) After Shepard, more astronauts went into space. Some orbited Earth. Some walked on the dusty, bumpy surface of the Moon. They took pictures and collected Moon rocks. Astronauts wanted to answer some important questions. Did the Sun’s warmth heat the Moon? Could the Moon support life someday?

(3) Scientists studied the photographs and Moon rocks that the astronauts brought back. They made exciting discoveries using telescopes and satellites. But it wasn’t enough. Scientists wanted to get closer to the other planets. Soon they found a way!` },
  presidents:{ t:'Presidents', x:`Many U.S. presidents have had nicknames. James Madison was sometimes called Jemmy. Honest Abe was a popular name for Abraham Lincoln. Dwight Eisenhower was known as Ike, and Theodore Roosevelt was Teddy. Several presidents have been called by their initials. John F. Kennedy was JFK, while Lyndon B. Johnson was LBJ.` },
  planets:{ t:'Title: ________', x:`There are eight planets in the Solar System, and each one is very different. Some planets, like Jupiter and Saturn are very large. Others, like Mercury and Mars are smaller. Jupiter has moons that are larger than Mercury. The planets also have different atmospheres. Uranus, Jupiter and Saturn have atmospheres of hydrogen and helium. The atmosphere on Venus is made up of carbon dioxide. Earth has a nitrogen and oxygen atmosphere. Neptune’s atmosphere is mostly hydrogen. The planets also have different temperatures. Uranus is the coldest and Venus is the hottest.` },
  winds:{ t:'Winds', x:`Do you know what a chinook is? It’s a warm winter wind in the western United States. Another wind is a purga. This very cold wind brings snow to Russia. In France, there is a dry wind called a mistral. Egypt has a khamsin. This wind blows across the desert, stirring up sand. Around the world, different winds come and go with the seasons.` },
  dogs:{ t:'Dogs Are the Best Pets', x:`Many people around the world have pets. Pets can keep us company and play with us. Some people like lizards or snakes. Others keep fish or birds. Most people have a dog or a cat. I think that dogs are the best pets.

(1) First of all, dogs are loyal and loving. They will always be there for you, in every situation, no matter what. They will comfort you when you are sad or lonely. They will protect you from harm and danger.

(2) Secondly, dogs are fun and playful. They will join you for walks, runs, hikes, or any other outdoor activity. They will make you laugh with their silly antics and expressions. They will entertain you with their tricks and skills. For example, tricks like playing dead or rolling over.

(3) The third reason is that dogs are smart and trainable. They can learn to help people with disabilities. They can help by being guide dogs, service dogs, or therapy dogs. They can also help people with jobs such as police dogs, rescue dogs, or hunting dogs.

In conclusion, dogs make the best pets because they are loyal, fun, and smart. If you are looking for a pet, you should choose a dog. You won't regret it.` },
  saturn:{ t:'The Rings of Saturn', x:`[Photograph A: Real image of Saturn’s rings.]

Saturn is a planet with rings around it. You can see its rings through a telescope. They look solid, but they are made of pieces of rock and ice. Some pieces are very small. Others are as big as mountains. How were the rings made? Scientists are not sure. The rocks and ice could be pieces of an old moon that crashed into Saturn.

[B: some words are printed in boldface]  [C: a chart showing the widths of Saturn’s rings]` },
  modelt:{ t:'Moving America Forward', x:`(1) Henry Ford introduced the Ford Model T car in 1908. The original vehicles came in blue, gray, green, and red. They cost $850 to buy. Everyone wanted a Model T, and thanks to the moving assembly line, almost everyone could have one. By 1918, half of all cars in the United States were Model Ts.

Everybody Wants One
(2) The Model T was not the first car ever made, but it was the one most people could afford to buy at the time. One of the resources Ford used to build the Model T was steel. The car, which was nicknamed “Tin Lizzie,” was built to hold up on rough roads. It was dependable and easy to drive. They were also simple to maintain, or fix. As the nation’s population grew, more and more people were buying cars. They wanted to own a Model T.

(3) Before the Model T, cars were expensive. Not everyone had enough money to own one. Ford knew that he needed to bring the price down. First he found a way to make more cars to meet the demand. Then he built them faster. Finally, he was able to make them affordable, or lower the cost so more people could buy one.` },
};

/* ---------- 出題小幫手 ---------- */
const Wd = (w,pos,zh,def,ex) => ({ k:'w', w, pos, zh, def, ex });
const fill = (box, rows, lab) => rows.map(([q,a]) => ({ k:'mc', q, a, box, lab: lab || '選出適合的字' }));
const two = (rows, lab) => rows.map(([q,a,b]) => ({ k:'mc', q, a, o:[b], lab: lab || '二選一' }));
const mc = (q, a, o, p, lab) => ({ k:'mc', q, a, o, p, lab: lab || (p ? '閱讀理解' : '選擇題') });
const tf = (rows, p, lab) => rows.map(([q,v]) => ({ k:'tf', q, a: v ? 'True' : 'False', p, lab: lab || 'True or False' }));

const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = (a,n) => shuffle(a).slice(0,n);
const words = s => s.replace(/[“”".,!?:;()]/g,' ').split(/\s+/).filter(Boolean);
const uniq = a => [...new Set(a)];
// 從句子裡挑其他字當誘答
function sentOpts(s, a, n=2){
  const ans = a.toLowerCase().split(/,\s*/);
  const pool = uniq(words(s).filter(w => !ans.includes(w.toLowerCase()) && !a.toLowerCase().split(' ').includes(w.toLowerCase()) && w.length > 1 && !/^(the|a|an|of|to|in|on|at|and)$/i.test(w)));
  return shuffle(pool).slice(0,n);
}
const Q = (q, a, o, lab) => ({ k:'mc', q, a, o, lab: lab || '選出正確答案' });
const FX = (q, a, fixed, lab) => ({ k:'mc', q, a, fixed, lab });
const opts2 = (rows, lab) => rows.map(([q,a,b]) => ({ k:'mc', q, a, o:[b], lab: lab || '選出正確的字' }));
const pickW = (rows, lab) => rows.map(([s,a]) => ({ k:'mc', q:s, a, o:sentOpts(s,a), lab }));
const partOf = (rows, which) => rows.map(([s,p]) => {
  const full = `${s} ${p}`, sw = s.split(' '), pw = p.replace(/\.$/,'').split(' ');
  const pr = p.replace(/\.$/,'');
  const a = which === 'subj' ? s : pr, other = which === 'subj' ? pr : s;
  const third = which === 'subj' ? (sw.length > 1 ? sw[sw.length-1] : pw[0]) : (pw.length > 1 ? pw[0] : sw[0]);
  return { k:'mc', q:full, a, o:uniq([other, third]).filter(x => x !== a), lab: which === 'subj' ? '哪一個是完整主詞 complete subject？' : '哪一個是完整述語 complete predicate？' };
});
const cp = rows => rows.map(([s,a]) => FX(s, a, ['common','proper'], '【 】裡的名詞是 common 還是 proper？'));
function capVariants(a){
  const ws = a.split(' ');
  const lower = a.toLowerCase();
  const first = ws.map((w,i) => i ? w.toLowerCase() : w).join(' ');
  const every = ws.map(w => w[0].toUpperCase() + w.slice(1)).join(' ');
  return uniq([every, first, lower]).filter(x => x !== a).slice(0,2);
}
const caps = rows => rows.map(([s,a]) => ({ k:'mc', q:s, a, o:capVariants(a), lab:'選出正確大寫的專有名詞' }));
function plWrong(w, a, extra=[]){
  const c = extra.length ? [...extra, w+'s'] : [w+'s', w+'es', w.replace(/y$/,'ies'), w.replace(/y$/,'ys'), w+'ies', w];
  return shuffle(uniq(c).filter(x => x !== a)).slice(0,2);
}
const plural = (rows, lab) => rows.map(([w,a,extra]) => ({ k:'mc', q:`What is the plural of “${w}”?`, a, o:plWrong(w,a,extra), lab: lab || '選出正確的複數' }));
const pluralIn = (rows) => rows.map(([s,w,a,extra]) => ({ k:'mc', q:s.replace(`(${w})`,`(${w}) ___`), a, o:plWrong(w,a,extra), lab:'寫出括號裡名詞的複數' }));
function possWrong(b, a){
  const c = /s$/.test(b) && !/us$/.test(b) ? [b+"'s", b.slice(0,-1)+"'s", b] : [b+"'s", b+"s'", b+"s", b+"'"];
  return shuffle(uniq(c).filter(x => x !== a)).slice(0,2);
}
const poss = (rows, lab) => rows.map(([q,b,a]) => ({ k:'mc', q, a, o:possWrong(b,a), lab: lab || '選出正確的所有格' }));

  { id:'gct', en:'Contractions with Not', zh:'not 的縮寫', theme:'ocean',
    notes:['A contraction is a shortened form of two words. An apostrophe ( ’ ) takes the place of missing letters.','is not = isn’t　has not = hasn’t　was not = wasn’t　are not = aren’t','do not = don’t　does not = doesn’t　did not = didn’t　have not = haven’t','特別記：will not = won’t　cannot = can’t'],

const canSpeak = 'speechSynthesis' in window;
/* 發音：挑一個自然的美式英語聲音。
   iPad / Mac 的英文聲音清單裡有很多「特效聲」（Albert、Bad News、Bubbles、Zarvox…）和機器腔（Eddy、Flo、Grandma…），
   以前直接拿第一個 en-US 聲音，常常會抽到這些，發音聽起來怪怪的。現在先排除它們，再依序挑比較自然的聲音。 */
const NOVELTY = /Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Junior|Ralph|Kathy|Eddy|Flo|Grandma|Grandpa|Reed|Rocko|Sandy|Shelley|Hysterical|Deranged|Pipe Organ/i;
const PREFER = [/Google US English/i, /Microsoft (Aria|Jenny|Ava|Andrew|Emma|Brian|Guy|Michelle).*Natural/i, /Samantha/i, /(Enhanced|Premium)/i, /Allison|Ava|Susan|Nicky|Joelle|Evan|Nathan|Zoe/i, /Microsoft (Zira|David|Mark)/i];
let voice = null;
function pickVoice(){
  const all = speechSynthesis.getVoices().filter(v => !NOVELTY.test(v.name));
  const us = all.filter(v => /^en[-_]US/i.test(v.lang));
  for(const re of PREFER){ const v = us.find(v => re.test(v.name)); if(v) return v; }
  return us.find(v => v.localService) || us[0] || all.find(v => /^en[-_](GB|AU|CA)/i.test(v.lang)) || null;
}
function speak(text){
  if(!canSpeak) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.9; u.pitch = 1;
    if(!voice) voice = pickVoice();
    if(voice){ u.voice = voice; u.lang = voice.lang; }
    speechSynthesis.speak(u);
  }catch(e){}
}

function rngFrom(str){
  let h = 2166136261;
  for(const c of str){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  return () => { h += 0x6D2B79F5; let t = h; t = Math.imul(t ^ t>>>15, t|1); t ^= t + Math.imul(t ^ t>>>7, t|61); return ((t ^ t>>>14)>>>0) / 4294967296; };
}

function ridge(g,r,base,amp,f,x0=0,x1=W){

  g.lineTo(x1,H); g.closePath(); g.fill();
}
function pine(g,x,y,h,col,shade){
  g.fillStyle = col;

    g.beginPath(); g.moveTo(x, yy - h*.5); g.lineTo(x+ww, yy); g.lineTo(x-ww, yy); g.closePath(); g.fill();
    if(shade){ g.fillStyle = shade; g.beginPath(); g.moveTo(x, yy - h*.5); g.lineTo(x+ww, yy); g.lineTo(x, yy); g.closePath(); g.fill(); g.fillStyle = col; }
  }
}

  if(e.state === 'die'){ const p = Math.min(1, e.dt/.55); alpha = 1-p; rot = p*1.1; dy = -Math.sin(p*Math.PI)*12; }
  if(e.state === 'attack' && e.dt > .7){ alpha = Math.max(0, 1-(e.dt-.7)/.25); }
  g.save(); g.globalAlpha = alpha;
  g.fillStyle = 'rgba(0,0,0,.25)'; ell(g, e.x, GROUND+8, 14*s, 3.5); g.fill();
  if(target){
    g.strokeStyle = '#e0aa3e'; g.lineWidth = 2.5; ell(g, e.x, GROUND+8, 19*s, 5); g.stroke();
    const by = GROUND - 34*s - 14 + Math.sin(e.t*5)*2.5;
    g.fillStyle = '#e0aa3e'; g.strokeStyle = T.ink; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(e.x-6,by-6); g.lineTo(e.x+6,by-6); g.lineTo(e.x,by+2); g.closePath(); g.fill(); g.stroke();
  }
  g.translate(e.x, GROUND+6+dy); g.rotate(rot);
  const moving = e.state === 'walk' && e.stun <= 0;
  const wk = moving ? e.t*9 : 0;
  g.fillStyle = T.ink;
  ell(g, -5 + Math.sin(wk)*3, 0, 4.6, 2.6); g.fill();
  ell(g,  5 - Math.sin(wk)*3, 0, 4.6, 2.6); g.fill();
  g.translate(0, -Math.abs(Math.sin(wk))*2 - 1);
  const h = 30*s, w = 13*s;
  // 棍棒（拿在面向城堡的那一手）
  g.save(); g.translate(-w*.95, -h*.42);
  const swing = e.state === 'attack' ? -1.3 + Math.sin(Math.min(e.dt,.6)/.6*Math.PI)*1.6 : -.45 + Math.sin(wk)*.15;
  g.rotate(swing);
  g.fillStyle = '#7a5634'; g.strokeStyle = T.ink; g.lineWidth = 1.5;
  g.fillRect(-1.6,-15,3.4,15); g.strokeRect(-1.6,-15,3.4,15);
  ell(g,0,-17,4.2,5.6); g.fill(); g.stroke();
  g.restore();
  // 身體
  g.beginPath(); g.moveTo(0,-h);
  g.bezierCurveTo(w*1.25,-h, w*1.3,-3, w*.8,-2);
  g.quadraticCurveTo(0,1,-w*.8,-2);
  g.bezierCurveTo(-w*1.3,-3,-w*1.25,-h,0,-h);
  g.closePath(); g.fillStyle = e.color; g.fill();
  g.strokeStyle = T.ink; g.lineWidth = 2; g.stroke();
  g.save(); g.clip(); g.fillStyle = 'rgba(0,0,0,.16)'; ell(g, w*.9, -h*.4, w*.6, h*.75); g.fill(); g.restore();
  g.fillStyle = 'rgba(255,255,255,.14)'; ell(g, -1, -h*.28, w*.55, h*.2); g.fill();
  // 角
  g.fillStyle = '#e8dfc9'; g.lineWidth = 1.5;
  const horn = side => { g.beginPath(); g.moveTo(side*w*.32,-h*.9); g.quadraticCurveTo(side*w*.95,-h*1.05, side*w*.78,-h*1.32); g.quadraticCurveTo(side*w*.55,-h*1.08, side*w*.08,-h*.98); g.closePath(); g.fill(); g.stroke(); };
  if(e.horn === 0){ horn(-1); horn(1); }
  else if(e.horn === 1){ g.beginPath(); g.moveTo(-w*.25,-h*.97); g.quadraticCurveTo(-w*.1,-h*1.35, w*.18,-h*1.38); g.quadraticCurveTo(w*.05,-h*1.1, w*.25,-h*.97); g.closePath(); g.fill(); g.stroke(); }
  else { g.fillStyle = e.color; [-1,1].forEach(sd => { ell(g, sd*w*.7, -h*.92, w*.32, h*.2); g.fill(); g.stroke(); }); }
  // 眼睛（看向左邊的城堡）
  const ey = -h*.62, ex = -w*.3;
  const stunned = e.stun > 0;
  [[ex-4,3.3],[ex+4,3.6]].forEach(([cx,rr]) => {
    g.fillStyle = '#f4efe2'; ell(g,cx,ey,rr,rr*1.12); g.fill(); g.strokeStyle = T.ink; g.lineWidth = 1.2; g.stroke();
    if(stunned){ g.strokeStyle = T.ink; g.lineWidth = 1.2; g.beginPath(); g.moveTo(cx-1.8,ey-1.8); g.lineTo(cx+1.8,ey+1.8); g.moveTo(cx+1.8,ey-1.8); g.lineTo(cx-1.8,ey+1.8); g.stroke(); }
    else { g.fillStyle = T.eye; circle(g,cx-1.1,ey+.3,1.7); g.fill(); }
  });
  g.strokeStyle = T.ink; g.lineWidth = 1.6;
  g.beginPath(); g.moveTo(ex-7,ey-5.5); g.lineTo(ex-1.5,ey-3.5); g.moveTo(ex+1.5,ey-3.5); g.lineTo(ex+7.5,ey-5.8); g.stroke();
  g.lineWidth = 1.3; g.beginPath(); g.moveTo(ex-4,-h*.33); g.lineTo(ex-2,-h*.37); g.lineTo(ex,-h*.33); g.lineTo(ex+2,-h*.37); g.lineTo(ex+4,-h*.33); g.stroke();
  if(e.flash > 0){ g.globalAlpha = alpha * Math.min(1, e.flash/.12) * .7; g.fillStyle = '#fff'; g.beginPath(); g.moveTo(0,-h); g.bezierCurveTo(w*1.25,-h, w*1.3,-3, w*.8,-2); g.quadraticCurveTo(0,1,-w*.8,-2); g.bezierCurveTo(-w*1.3,-3,-w*1.25,-h,0,-h); g.fill(); }
  g.restore();
  if(stunned){
    g.fillStyle = '#e0aa3e';
    for(let k=0;k<3;k++){ const a = e.t*6 + k*2.1; circle(g, e.x + Math.cos(a)*10, GROUND - 32*s - 4 + Math.sin(a)*3, 2); g.fill(); }
  }
}
function drawArrow(g,x,y,ang,T){
  g.save(); g.translate(x,y); g.rotate(ang);
  g.strokeStyle = '#5b4026'; g.lineWidth = 1.8; g.beginPath(); g.moveTo(-15,0); g.lineTo(5,0); g.stroke();
  g.fillStyle = T.ink; g.beginPath(); g.moveTo(9,0); g.lineTo(3,-3); g.lineTo(3,3); g.closePath(); g.fill();
  g.fillStyle = '#e9e1cc'; g.beginPath(); g.moveTo(-15,0); g.lineTo(-19,-3.5); g.lineTo(-12,0); g.lineTo(-19,3.5); g.closePath(); g.fill();
  g.restore();
}

/* ---------- 出題 ---------- */
const TYPE_LABEL = { def2w:'看定義，選單字', w2def:'看單字，選定義', listen:'聽發音，選出正確拼字', listenW:'聽發音，選單字', fill:'例句填空', unscr:'字母重組' };
const REAL = new Set([...ALL.filter(x => x.k === 'w').map(x => x.w), 'plain','plane','way','slay','grey','wait','weight','sale','tail','tale','main','mane','pain','pane','sail','rise','fin','plan','rays','gate','fail','rows','dat','sneez']);
const wordRe = x => new RegExp('\\b' + x.w.replace(/ /g,'\\s') + '\\b', 'i');
const canFill = x => wordRe(x).test(x.ex);
function misspell(w){
  const out = new Set();
  const rules = [[/ai/,'ay'],[/ay$/,'ai'],[/ay$/,'ey'],[/a([^aeiou])e$/,'ai$1'],[/a([^aeiou])e$/,'a$1'],[/i([^aeiou])e$/,'y$1e'],[/i([^aeiou])e$/,'ie$1'],
                 [/o([^aeiou])e$/,'oa$1'],[/eigh/,'ay'],[/eigh/,'iegh'],[/eigh/,'eih'],[/ey$/,'ay'],[/ee/,'ea'],[/e$/,''],[/ai/,'a'],[/ui/,'iu'],[/([^aeiou])$/,'$1e']];
  rules.forEach(([re,to]) => { if(re.test(w)) out.add(w.replace(re,to)); });
  for(let i=1;i<w.length-1;i++) out.add(w.slice(0,i) + w[i+1] + w[i] + w.slice(i+2));
  return shuffle([...out].filter(s => s !== w && s.length >= 3 && !REAL.has(s))).slice(0,3);
}
function scramble(w){
  for(let t=0;t<20;t++){ const s = shuffle(w.split('')).join(''); if(s !== w) return s; }
  return w.split('').reverse().join('');
}
function makeQuestion(x, avoid){
  if(x.k === 'tf') return { item:x, type:'tf', labels:['True','False'], answer:x.a, lab:x.lab };
  if(x.k === 'mc'){
    const lower = s => s.toLowerCase();
    if(x.fixed) return { item:x, type:'mc', labels:x.fixed.slice(), answer:x.a, lab:x.lab };
    const others = x.o ? x.o : pick(x.box.filter(y => lower(y) !== lower(x.a)), 3);
    const opts = x.keep ? [x.a, ...others] : shuffle([x.a, ...others]);
    return { item:x, type:'mc', labels:opts, answer:x.a, lab:x.lab };
  }
  // 單字卡
  const unitWords = x.unit.items.filter(y => y.k === 'w');
  const spell = x.unit.spell;
  let types = ['def2w','w2def'];
  if(canSpeak) types.push('listen');
  if(canFill(x)) types.push('fill','fill');
  if(spell) types.push('unscr');
  types = types.filter(t => t !== avoid);
  const type = types[Math.floor(Math.random()*types.length)];
  const others = pick(unitWords.filter(y => y.w !== x.w), 3);
  if(type === 'listen' && spell){
    const ms = misspell(x.w);
    if(ms.length === 3) return { item:x, type, labels:shuffle([x.w, ...ms]), answer:x.w };
  }
  const opts = shuffle([x, ...others]);
  if(type === 'w2def') return { item:x, type, labels:opts.map(o => o.def), answer:x.def };
  return { item:x, type: type === 'listen' ? 'listenW' : type, labels:opts.map(o => o.w), answer:x.w, scr: type === 'unscr' ? scramble(x.w) : null };
}
const fmtQ = s => esc(s).replace(/___/g,'<span class="blank"></span>').replace(/【(.+?)】/g,'<b class="hl">$1</b>');
const filled = (q,a) => esc(q).replace(/___/, `<b class="hl">${esc(a)}</b>`).replace(/【(.+?)】/g,'<b class="hl">$1</b>');

/* =========================================================
   遊戲主體
   ========================================================= */
let G = null;
function stopGame(){ if(G){ G.dead = true; cancelAnimationFrame(G.raf); } }

function startGame(cfg){
  stopGame();
  const T = THEMES[cfg.theme];
  cfg = Object.assign({}, cfg, { speed: cfg.speed * PATH_K });
  G = { cfg, T, bg:makeBg(cfg.theme), queue:cfg.ordered ? cfg.items.slice() : shuffle(cfg.items), total:cfg.items.length,
        enemies:[], arrows:[], stuck:[], parts:[], cracks:[], boulder:null, banner:null,
        hp:MAX_HP, right:0, killed:0, breached:0, streak:0, missed:new Set(),
        time:0, spawnT:1.2, slowUntil:0, lock:0, cur:null, panel:'', pull:0, shake:0, paused:false, over:false, dead:false, last:0 };
  $app.innerHTML = `
    <div class="topbar">
      <button class="tbtn" id="back">${IC.back}撤退</button>
      <b>${esc(cfg.title)}</b>
      <button class="tbtn" id="pause">${IC.pause}暫停</button>
    </div>
    <div class="field"><canvas id="cv" width="${W*DPR}" height="${H*DPR}" aria-label="戰場畫面"></canvas></div>
    <div class="hud">
      <div class="grp">城牆 <span class="pips" id="hpP"></span></div>
      <div class="grp">連擊 <span class="pips" id="cbP"></span></div>
      <div class="grp">剩餘敵人 <span class="num" id="left"></span></div>
    </div>

  G.cv = document.getElementById('cv'); G.g = G.cv.getContext('2d');
  document.getElementById('back').onclick = () => { const was = G.paused; G.paused = true; ask('確定要撤退嗎？這一場的進度不會保留。', () => { stopGame(); showMap(); }); document.getElementById('modalNo').onclick = () => { document.getElementById('modal').hidden = true; G.paused = was; syncPause(); }; };
  document.getElementById('pause').onclick = () => { G.paused = !G.paused; syncPause(); };
  hud(); renderWait();
  G.raf = requestAnimationFrame(loop);
  scrollTo(0,0);
}
function syncPause(){
  const b = document.getElementById('pause'); if(!b) return;
  b.innerHTML = G.paused ? `${IC.play}繼續` : `${IC.pause}暫停`;
}
function hud(){
  if(!G || G.dead) return;
  const left = G.queue.length + G.enemies.filter(e => e.state === 'walk').length;
  document.getElementById('hpP').innerHTML = Array.from({length:MAX_HP}, (_,i) => IC.shield(i < G.hp)).join('');
  document.getElementById('cbP').innerHTML = Array.from({length:COMBO}, (_,i) => IC.gem(i < G.streak % COMBO)).join('');
  document.getElementById('left').textContent = `${left} / ${G.total}`;
}

function spawn(){
  const w = G.queue.shift();
  G.enemies.push({ w, x:W+24, state:'walk', t:Math.random()*3, dt:0, stun:0, flash:0, doomed:false, lastType:null,
                   scale:.9 + Math.random()*.22, horn:Math.floor(Math.random()*3), color:G.T.enemy[Math.floor(Math.random()*G.T.enemy.length)] });
  hud();
}
function ink(x,y,col,n=14,spd=120){
  for(let i=0;i<n;i++){ const a = Math.random()*Math.PI*2, v = spd*(.3+Math.random()*.8);
    G.parts.push({ x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v - 60, life:.6 + Math.random()*.4, max:1, r:1.5 + Math.random()*3, col }); }
}
function addCrack(){
  const pts = []; let x = 60 + Math.random()*90, y = 140 + Math.random()*80;
  pts.push([x,y]); for(let k=0;k<5;k++){ x += (Math.random()-.5)*16; y += 5 + Math.random()*9; pts.push([x,y]); }
  G.cracks.push(pts);
}
function markWrong(x){ G.missed.add(x.id); S.wrong[x.id] = (S.wrong[x.id] || 0) + 1; save(); }

function update(dt){
  G.time += dt;
  const slow = (G.time < G.slowUntil ? .35 : 1) * (G.cur && G.cur.q.item.p ? PASSAGE_SLOW : 1);
  G.spawnT -= dt;
  const walkers = G.enemies.filter(e => e.state === 'walk');
  if(G.queue.length && walkers.length < 4 && (G.spawnT <= 0 || walkers.length === 0)){ spawn(); G.spawnT = G.cfg.every; }
  for(const e of G.enemies){
    e.t += dt; if(e.flash > 0) e.flash -= dt;
    if(e.state === 'walk'){
      if(e.stun > 0) e.stun -= dt;
      else { e.x -= G.cfg.speed * slow * dt; if(e.x <= STOP_X){ e.x = STOP_X; e.state = 'attack'; e.dt = 0; } }
    }else if(e.state === 'attack'){
      e.dt += dt;
      if(e.dt > .45 && !e.hitDone){
        e.hitDone = true; G.hp = Math.max(0, G.hp-1); G.breached++; G.shake = .4; addCrack();
        markWrong(e.w);
        ink(STOP_X-6, GROUND-14, '#8a8f8c', 10, 90); hud();
      }
      if(e.dt > .95){ e.state = 'gone'; ink(e.x, GROUND-10, 'rgba(60,60,60,.6)', 8, 60); hud(); }
    }else if(e.state === 'die'){ e.dt += dt; if(e.dt > .55) e.state = 'gone'; }
  }
  for(const a of G.arrows){
    a.t += dt;
    if(a.t >= a.dur && !a.done){
      a.done = true;
      if(a.hit && a.e.state !== 'gone'){ a.e.state = 'die'; a.e.dt = 0; a.e.flash = .15; G.killed++; ink(a.e.x, GROUND-14*a.e.scale, a.e.color, 16, 140); ink(a.e.x, GROUND-14, G.T.ink, 6, 100); hud(); }
      else if(!a.hit){ G.stuck.push({ x:a.x1, y:a.y1, ang:a.endAng, life:3 }); ink(a.x1, a.y1, G.T.pathD, 6, 50); }
    }
  }
  G.arrows = G.arrows.filter(a => !a.done);
  G.stuck.forEach(s => s.life -= dt); G.stuck = G.stuck.filter(s => s.life > 0);
  if(G.boulder){
    const b = G.boulder; b.t += dt;
    if(b.t >= b.dur){
      G.shake = .3; ink(b.x1, GROUND, G.T.pathD, 22, 160);
      G.enemies.filter(e => e.state === 'walk').forEach(e => { e.x = Math.min(W-10, e.x + 70); e.stun = 1.8; e.flash = .12; });
      G.boulder = null;
    }
  }
  for(const p of G.parts){ p.life -= dt; p.vy += 320*dt; p.x += p.vx*dt; p.y += p.vy*dt; if(p.y > GROUND+20){ p.y = GROUND+20; p.vy *= -.3; p.vx *= .6; } }
  G.parts = G.parts.filter(p => p.life > 0);
  if(G.shake > 0) G.shake -= dt;
  if(G.pull > 0) G.pull -= dt*3;
  if(G.banner){ G.banner.t -= dt; if(G.banner.t <= 0) G.banner = null; }
  if(!G.over){
    if(G.hp <= 0) finish(false);
    else if(!G.queue.length && G.enemies.every(e => e.state === 'gone') && !G.arrows.length) finish(true);
  }
  if(!G.over) ensureQuestion();
}

function draw(){
  const g = G.g, T = G.T;
  g.setTransform(DPR,0,0,DPR,0,0);
  g.save();
  if(G.shake > 0){ const k = G.shake/.4; g.translate((Math.random()-.5)*7*k, (Math.random()-.5)*4*k); }
  g.drawImage(G.bg,0,0,W,H);
  g.strokeStyle = T.ink; g.lineWidth = 1.6; g.lineJoin = 'round';
  G.cracks.forEach(c => { g.beginPath(); c.forEach(([x,y],i) => i ? g.lineTo(x,y) : g.moveTo(x,y)); g.stroke(); });
  drawFlag(g,T,G.time);
  drawArcher(g,T,Math.max(0,G.pull));
  G.stuck.forEach(s => { g.globalAlpha = Math.min(1, s.life); drawArrow(g,s.x,s.y,s.ang,T); g.globalAlpha = 1; });
  const tgt = G.cur && G.cur.enemy;
  [...G.enemies].sort((a,b) => b.x - a.x).forEach(e => drawEnemy(g,e,T,e === tgt && e.state === 'walk'));
  for(const a of G.arrows){
    const p = Math.min(1, a.t/a.dur), arc = a.arc;
    const pos = q => [a.x0 + (a.x1-a.x0)*q, a.y0 + (a.y1-a.y0)*q - arc*Math.sin(Math.PI*q)];
    const [x,y] = pos(p), [x2,y2] = pos(Math.min(1,p+.02)), [x0,y0] = pos(Math.max(0,p-.02));
    a.endAng = Math.atan2(y2-y0, x2-x0);
    drawArrow(g,x,y,a.endAng,T);
  }
  if(G.boulder){
    const b = G.boulder, p = Math.min(1, b.t/b.dur);
    const x = b.x0 + (b.x1-b.x0)*p, y = b.y0 + (b.y1-b.y0)*p - 120*Math.sin(Math.PI*p);
    g.save(); g.translate(x,y); g.rotate(p*8);
    g.fillStyle = T.stone; circle(g,0,0,8); g.fill(); g.strokeStyle = T.ink; g.lineWidth = 2; g.stroke();
    g.lineWidth = 1; g.beginPath(); g.moveTo(-4,-2); g.lineTo(1,1); g.lineTo(4,-3); g.stroke();
    g.restore();
  }
  for(const p of G.parts){ g.globalAlpha = Math.max(0, Math.min(1, p.life/.4)); g.fillStyle = p.col; circle(g,p.x,p.y,p.r); g.fill(); }
  g.globalAlpha = 1;
  g.restore();
  if(G.banner){
    const a = Math.min(1, G.banner.t/.3);
    g.globalAlpha = a;
    g.font = '900 20px "Noto Serif TC", serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    const tw = g.measureText(G.banner.text).width + 36;
    g.fillStyle = 'rgba(238,240,234,.94)'; g.strokeStyle = T.ink; g.lineWidth = 2;
    g.beginPath(); g.roundRect(W/2 + 60 - tw/2, 26, tw, 40, 6); g.fill(); g.stroke();
    g.fillStyle = '#1c2428'; g.fillText(G.banner.text, W/2 + 60, 47);
    g.globalAlpha = 1;
  }
  if(G.paused && !G.over){
    g.fillStyle = 'rgba(12,17,20,.55)'; g.fillRect(0,0,W,H);
    g.fillStyle = '#e9ece4'; g.font = '900 28px "Noto Serif TC", serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('暫停中', W/2, H/2);
  }
}

function loop(ts){
  if(!G || G.dead) return;
  const now = ts/1000, dt = Math.min(.05, G.last ? now - G.last : 0);
  G.last = now;
  if(!G.paused && !(G.over && G.endIn <= 0)){
    update(dt);
    if(G.over){ G.endIn -= dt; if(G.endIn <= 0){ const w = G.won; stopGame(); showResult(w); return; } }
  }
  draw();
  G.raf = requestAnimationFrame(loop);
}
document.addEventListener('visibilitychange', () => { if(document.hidden && G && !G.dead && !G.over){ G.paused = true; syncPause(); } });

/* ---------- 題目板 ---------- */
function ensureQuestion(){
  if(G.time < G.lock) return;
  const target = G.enemies.filter(e => e.state === 'walk' && !e.doomed).sort((a,b) => a.x - b.x)[0];
  if(!target){ G.cur = null; if(G.panel !== 'wait') renderWait(); return; }
  if(!G.cur || G.cur.enemy !== target || G.cur.stale){
    const q = makeQuestion(target.w, target.lastType);
    target.lastType = q.type;
    G.cur = { enemy:target, q };
    renderQ();
  }
}
function renderWait(){

  document.getElementById('qp').innerHTML = `<div class="wait"><div><b>敵軍正在接近</b><br>出現在小路上就會出題，答對讓弓箭手射擊</div></div>`;
}
function passageHtml(key, open){
  const p = P[key];
  return `<details class="psg" ${open ? 'open' : ''}><summary>${IC.book}<span>${esc(p.t)}</span></summary><div class="ptext">${p.x.split(/\n\n/).map(t => `<p>${esc(t).replace(/\n/g,'<br>')}</p>`).join('')}</div></details>`;
}
function renderQ(){
  G.panel = 'q';
  const q = G.cur.q, x = q.item;
  let p = '';
  if(q.type === 'def2w') p = `<div class="prompt sent">${esc(x.def)}</div>`;
  else if(q.type === 'w2def') p = `<div class="prompt w">${esc(x.w)}<span class="pos">${esc(x.pos)}</span></div>${canSpeak ? `<button class="say" data-say="${esc(x.w)}">${IC.speaker}發音</button>` : ''}`;
  else if(q.type === 'listen' || q.type === 'listenW') p = `<button class="bigsay" data-say="${esc(x.w)}">${IC.speaker}再聽一次</button>`;
  else if(q.type === 'fill'){ const m = x.ex.match(wordRe(x)); p = `<div class="prompt sent">${esc(x.ex.slice(0,m.index))}<span class="blank"></span>${esc(x.ex.slice(m.index + m[0].length))}</div>`; }
  else if(q.type === 'unscr') p = `<div class="prompt w scr">${esc(q.scr)}</div><div class="trans">把字母排回正確的單字</div>`;
  else {
    if(x.p) p += passageHtml(x.p, G.lastP !== x.p || G.pOpen);
    const lines = x.q.split('\n');
    p += lines.map(l => `<div class="prompt sent ${x.q.length > 90 ? 'long' : ''}">${fmtQ(l)}</div>`).join('');
  }
  const long = q.labels.some(l => l.length > 24);
  const latin = q.type !== 'w2def';
  document.getElementById('qp').innerHTML = `
    <div class="qlabel">${esc(q.lab || TYPE_LABEL[q.type])}</div>
    ${p}
    <div class="opts ${long ? 'long' : ''} ${q.labels.length === 2 ? 'two' : ''}">${q.labels.map((l,j) => `<button class="opt ${latin && !long ? 'latin' : ''}" data-j="${j}"><span class="k">${j+1}</span>${esc(l)}</button>`).join('')}</div>
    <div class="fb" id="fb"></div>`;
  const d = document.querySelector('#qp .psg');
  if(d){ G.lastP = x.p; d.ontoggle = () => { G.pOpen = d.open; }; }
  bindSay();
  document.querySelectorAll('#qp .opt').forEach(b => b.onclick = () => answer(+b.dataset.j));
  if(q.type === 'listen' || q.type === 'listenW') setTimeout(() => speak(x.w), 200);
}
function bindSay(){ document.querySelectorAll('[data-say]').forEach(b => b.onclick = () => speak(b.dataset.say)); }
document.addEventListener('keydown', e => {
  if(!G || G.dead || G.over || G.paused || G.panel !== 'q') return;
  const n = parseInt(e.key, 10); if(n >= 1 && n <= G.cur.q.labels.length) answer(n-1);
});

function answerText(x){
  if(x.k === 'w') return `<b>${esc(x.w)}</b> <span class="pos">${esc(x.pos)}</span>　${esc(x.zh)}<br><span class="trans">${esc(x.def)}</span>`;
  if(x.k === 'mc' && /___/.test(x.q) && !x.q.includes('\n')) return `<span class="trans latin" style="font-size:16px">${filled(x.q, x.a)}</span>`;
  return `<b>${esc(x.a)}</b>`;
}
function answer(j){
  if(!G || !G.cur || G.over || G.paused || G.time < G.lock || G.cur.answered) return;
  const { enemy:e, q } = G.cur, x = q.item;
  G.cur.answered = true;
  const ok = q.labels[j] === q.answer;
  const btns = document.querySelectorAll('#qp .opt');
  btns.forEach((b,n) => { b.disabled = true; if(q.labels[n] === q.answer) b.classList.add('ok'); });
  const fb = document.getElementById('fb');
  G.pull = 1;
  if(ok){
    e.doomed = true;
    const lead = e.stun > 0 ? 0 : G.cfg.speed*.45;
    G.arrows.push({ x0:142, y0:96, x1:e.x - lead, y1:GROUND - 14*e.scale, t:0, dur:.45, arc:34, hit:true, e });
    G.right++; G.streak++;
    if(S.wrong[x.id]){ S.wrong[x.id]--; if(S.wrong[x.id] <= 0) delete S.wrong[x.id]; }
    fb.innerHTML = `<span class="good">命中</span>　${answerText(x)}`;
    G.lock = G.time + (x.k === 'w' ? .8 : 1.1);
    if(G.streak % COMBO === 0){
      const ws = G.enemies.filter(z => z.state === 'walk' && z !== e);
      if(ws.length){
        const mid = ws.reduce((s,z) => s + z.x, 0) / ws.length;
        G.boulder = { x0:70, y0:60, x1:mid, y1:GROUND, t:0, dur:.85 };
        G.banner = { text:`連擊 ${G.streak}　投石擊退`, t:1.6 };
      }else G.banner = { text:`連擊 ${G.streak}`, t:1.2 };
    }
  }else{
    btns[j].classList.add('no');
    G.arrows.push({ x0:142, y0:96, x1:e.x + 26 + Math.random()*30, y1:GROUND+6, t:0, dur:.5, arc:30, hit:false, e });
    e.x = Math.max(STOP_X, e.x - 24);
    G.streak = 0;
    markWrong(x);
    fb.innerHTML = `<span class="bad">射偏了</span>　正確答案：${answerText(x)}${x.k === 'w' ? `<br><span class="trans latin" style="font-size:16px">${esc(x.ex)}</span>` : ''}`;
    G.lock = G.time + 2.6; G.slowUntil = G.lock;
    G.cur.stale = true;
  }
  save(); hud();
  if(x.k === 'w' && q.type !== 'listen' && q.type !== 'listenW') speak(x.w);
}

function finish(won){
  G.over = true; G.won = won; G.endIn = 1.3; G.cur = null;
  if(!won) G.banner = { text:'城門被攻破了', t:1.3 };
  else G.banner = { text:'守城成功', t:1.3 };
}

/* ---------- 畫面：地圖 ---------- */

  stopGame();
  const tb = TABS.find(t => t.id === S.tab) || TABS[0];
  const wrongN = Object.keys(S.wrong).filter(findItem).length;
  const idx = st => STAGES.indexOf(st);
  $app.innerHTML = `
    <header class="brand">
      <div><span class="en">Reading & Grammar Keep · Grade 3</span><h1>閱讀守城</h1></div>
      <p>Pink Book Cycles 3–4・G3 Grammar　答對題目，弓箭手就會射退敵人</p>
    </header>
    <nav class="weeks" aria-label="選擇範圍">${TABS.map(t => `<button class="wk ${t===tb?'on':''}" data-tab="${t.id}">${esc(t.name)}</button>`).join('')}</nav>
    <p class="lead latin" style="font-size:18px;color:var(--onDark);font-weight:700">${esc(tb.full)}</p>
    <div class="stages">
      ${tb.units.map((u,ui) => `<article class="stage">
        <canvas data-thumb="${u.theme}" aria-hidden="true"></canvas>
        <div class="body">
          <div class="head"><span class="no">UNIT ${ui+1}</span><h2>${esc(u.zh)}</h2></div>
          <div class="meta"><span class="latin" style="font-size:16px">${esc(u.en)}</span><span>${u.items.length} 題</span></div>
          <div class="parts">${STAGES.filter(st => st.unit === u).map(st => `<div class="part">
              <span><b>第 ${st.from}–${st.to} 題</b>　${starsHtml(S.stars[st.id] || 0)}</span>
              <button class="btn sm" data-play="${idx(st)}">${IC.sword}守城</button>
            </div>`).join('')}</div>
          <button class="btn alt" data-learn="${u.id}">${IC.book}預習重點${u.items.some(x => x.k === 'w') ? '與單字' : ''}${u.reading ? '與文章' : ''}</button>
        </div>
      </article>`).join('')}
      ${STAGES.filter(st => st.tab === tb && st.quiz).map(st => `<article class="stage">
        <canvas data-thumb="${st.theme}" aria-hidden="true"></canvas>
        <div class="body">
          <div class="head"><span class="no">${tb.id === 'final' ? 'FINAL' : 'QUIZ'}</span><h2>${esc(st.title.replace(/^.*　/,''))}</h2></div>
          <div class="meta"><span>${esc(st.desc)}</span>${starsHtml(S.stars[st.id] || 0)}</div>
          <button class="btn gold" data-play="${idx(st)}">${IC.sword}開始${esc(st.title.replace(/^.*　/,''))}</button>
        </div>
      </article>`).join('')}
    </div>
    <div class="row" style="margin-top:16px">
      <button class="btn quiet" id="toWrong">錯題本（${wrongN}）</button>
      <button class="btn quiet" id="toHelp">玩法說明</button>
    </div>
    <p class="foot">題目取自《Reading Workbook Grade 3 — Cycle 3, Cycle 4 & Final Exam Review》與《G3 Grammar》Answer Key。進度只存在這台裝置的瀏覽器，不會上傳。</p>`;
  document.querySelectorAll('[data-thumb]').forEach(cv => paintStill(cv, cv.dataset.thumb));
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; save(); showMap(); });
  document.querySelectorAll('[data-learn]').forEach(b => b.onclick = () => showLearn(b.dataset.learn));
  document.querySelectorAll('[data-play]').forEach(b => b.onclick = () => playStage(+b.dataset.play));
  document.getElementById('toWrong').onclick = showWrong;
  document.getElementById('toHelp').onclick = showHelp;
  scrollTo(0,0);
}
function playStage(i){
  const st = STAGES[i];
  let items = st.items, ordered = st.ordered;
  if(st.read){
    const keys = pick([...new Set(st.items.map(x => x.p))], 2);
    items = keys.flatMap(k => st.items.filter(x => x.p === k)); ordered = true;
  }else if(st.quiz) items = pick(st.items, Math.min(st.n, st.items.length));
  const slowRead = st.read;
  startGame({ title:st.title, theme:st.theme, items, ordered, speed:st.speed, every:st.every, stage:i });
}

function topbar(title, back = showMap){
  setTimeout(() => { const b = document.getElementById('back'); if(b) b.onclick = back; });
  return `<div class="topbar"><button class="tbtn" id="back">${IC.back}返回</button><b>${esc(title)}</b><span style="width:72px"></span></div>`;
}
function wordRow(x, extra=''){
  return `<div class="word">
    <div style="min-width:0">
      <div><span class="en">${esc(x.w)}</span><span class="pos">${esc(x.pos)}</span>　<span class="zh">${esc(x.zh)}</span>${extra}</div>
      <div class="exz latin" style="font-size:15px">${esc(x.def)}</div>
      <div class="ex">${esc(x.ex)}</div>
    </div>
    ${canSpeak ? `<button class="say" data-say="${esc(x.w)}" aria-label="播放 ${esc(x.w)} 的發音">${IC.speaker}</button>` : ''}
  </div>`;
}
function itemRow(x, extra=''){
  if(x.k === 'w') return wordRow(x, extra);
  const q = x.k === 'mc' && /___/.test(x.q) && !x.q.includes('\n') ? filled(x.q, x.a) : fmtQ(x.q).replace(/\n/g,'<br>');
  return `<div class="word"><div style="min-width:0">
      <div class="exz">${esc(x.unit.zh)}${x.p ? '・' + esc(P[x.p].t) : ''}${extra}</div>
      <div class="ex">${q}</div>
      <div><span class="ans">答案：</span><b class="latin">${esc(x.a)}</b></div>
    </div></div>`;
}

/* ---------- 畫面：預習 ---------- */
function showLearn(uid){
  const u = ALL.find(x => x.unit.id === uid).unit;
  const words = u.items.filter(x => x.k === 'w');
  const ps = [...new Set(u.items.map(x => x.p).filter(Boolean))];
  const first = STAGES.findIndex(st => st.unit === u);
  $app.innerHTML = `${topbar(u.zh)}
    <div class="sheet notes"><h3>重點</h3><ul>${u.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul></div>
    ${words.length ? `<div class="sheet"><h3>單字（${words.length}）</h3>${words.map(x => wordRow(x)).join('')}</div>` : ''}
    ${ps.length ? `<div class="sheet"><h3>文章（${ps.length} 篇）</h3>${ps.map(k => passageHtml(k, false)).join('')}</div>` : ''}
    <button class="btn full" id="go">${IC.sword}從第 1 關開始守城</button>`;
  document.getElementById('go').onclick = () => playStage(first);
  bindSay(); scrollTo(0,0);
}

/* ---------- 畫面：結果 ---------- */
function showResult(won){
  const cfg = G ? G.cfg : null; if(!cfg) return showMap();
  const hp = G.hp, isStage = cfg.stage !== undefined;
  const stars = won ? (hp >= MAX_HP ? 3 : hp >= 3 ? 2 : 1) : 0;
  const prev = isStage ? (S.stars[STAGES[cfg.stage].id] || 0) : 0;
  if(isStage && stars > prev){ S.stars[STAGES[cfg.stage].id] = stars; save(); }
  const nextOpen = isStage && won && cfg.stage < STAGES.length - 1 && STAGES[cfg.stage+1].unit && STAGES[cfg.stage+1].tab === STAGES[cfg.stage].tab;
  const missed = [...G.missed].map(findItem).filter(Boolean);
  $app.innerHTML = `
    <section class="result">
      <canvas id="still" aria-hidden="true"></canvas>
      <div class="body">
        <h2>${won ? '城守住了' : '城門被攻破了'}</h2>
        ${isStage ? `<div style="margin:8px 0">${starsHtml(stars)}</div>` : ''}
        ${isStage && stars > prev && prev > 0 ? '<p style="margin:0;color:var(--moss);font-weight:700">刷新最佳紀錄</p>' : ''}
        <div class="stats">
          <div><div class="n">${G.killed}</div><div class="l">擊退</div></div>
          <div><div class="n">${G.breached}</div><div class="l">衝到城下</div></div>
          <div><div class="n">${G.right}</div><div class="l">答對題數</div></div>
        </div>
      </div>
    </section>
    ${missed.length ? `<div class="sheet"><h3>這一場要再複習的題目</h3>${missed.map(x => itemRow(x)).join('')}</div>` : ''}
    <div class="row">
      <button class="btn alt" id="again">再守一次</button>
      ${nextOpen ? `<button class="btn gold" id="next">前往下一關</button>` : `<button class="btn" id="map">回到地圖</button>`}
    </div>`;
  paintStill(document.getElementById('still'), cfg.theme, { enemies: won ? [] : [{x:200,horn:0,c:0,s:1},{x:240,horn:1,c:1,s:.95}] });
  bindSay();
  document.getElementById('again').onclick = () => cfg.stage !== undefined ? playStage(cfg.stage) : startGame(Object.assign({}, cfg, { speed:cfg.speed/PATH_K }));
  const n = document.getElementById('next'); if(n) n.onclick = () => playStage(cfg.stage + 1);
  const m = document.getElementById('map'); if(m) m.onclick = showMap;
  scrollTo(0,0);
}

/* ---------- 畫面：錯題本 ---------- */
function showWrong(){
  const list = Object.entries(S.wrong).sort((a,b) => b[1]-a[1]).map(([id,n]) => [findItem(id), n]).filter(([x]) => x);
  $app.innerHTML = `${topbar('錯題本')}
    ${list.length
      ? `<p class="lead">答錯或讓敵人衝到城下的題目會記在這裡。之後答對一次，次數就減 1，減到 0 就會移出錯題本。</p>
         <div class="sheet">${list.map(([x,n]) => itemRow(x, `<span class="cnt">錯 ${n} 次</span>`)).join('')}</div>
         <button class="btn full" id="drill">${IC.sword}用錯題守城（${Math.min(list.length,10)} 隻敵人）</button>`
      : `<div class="sheet" style="padding:24px 16px;text-align:center">目前沒有錯題。</div>`}`;
  bindSay();
  const d = document.getElementById('drill');
  if(d) d.onclick = () => {
    const items = list.slice(0,10).map(([x]) => x);
    const slow = items.some(x => x.p);
    startGame({ title:'錯題特訓', theme:items[0].area, items, speed:slow ? READ.speed : 30, every:slow ? READ.every : 8 });
  };
  scrollTo(0,0);
}

/* ---------- 畫面：說明 ---------- */
function showHelp(){
  $app.innerHTML = `${topbar('玩法說明')}
    <div class="sheet help">
      <p>敵人會沿著小路走向城門，每隻敵人身上帶著一道題目。最前面的敵人腳下會出現<b>金色圈</b>，下方題目板出的就是牠的題目。</p>
      <p>答對，城牆上的弓箭手會射中牠；答錯，箭會射偏，敵人還會往前衝一步。答錯後會顯示正確答案，敵人也會暫時放慢腳步，讓你看清楚。</p>
      <p>連續答對 ${COMBO} 題，投石車會發射石塊，把所有敵人往後擊退並暈眩一下。</p>
      <p>敵人走到城門會敲城牆一下。城牆有 ${MAX_HP} 點耐久，全部用完就失敗。守住時城牆完好拿 3 顆星，剩 3～4 點拿 2 顆星，剩 1～2 點拿 1 顆星。</p>
      <p><b>範圍</b>：Cycle 3（Preserve and Protect）、Cycle 4（Earth and its Neighbors），涵蓋拼字、字彙、一字多義、字尾、文體、文本特徵、主旨與細節、閱讀理解；<b>Grammar 1、Grammar 2</b> 是 G3 Grammar 的 Units 1–6（主詞述語、名詞、複數、所有格、動詞時態、代名詞、形容詞、副詞）。</p>
      <p>有文章的題目會在題目上方顯示文章（可以按標題收起來），這時敵人會走得特別慢，先讀完再作答。</p>
      <p>每個分頁最後的<b>小考模擬</b>會隨機抽 ${QUIZ.n} 題、敵人比較快；<b>期末總複習</b>分頁有兩個 Cycle 混合的綜合模擬和閱讀模擬。</p>
      <p>單字題有五種：看定義選單字、看單字選定義、聽發音選拼字、例句填空、字母重組。用電腦玩可以按鍵盤 1～4 作答。</p>
    </div>
    <button class="btn quiet full" id="reset">清除這台裝置的進度</button>`;
  document.getElementById('reset').onclick = () => ask('確定要清除所有星星和錯題紀錄嗎？', () => { S.stars = {}; S.wrong = {}; save(); showMap(); });
  scrollTo(0,0);
}

if(canSpeak) speechSynthesis.onvoiceschanged = () => { voice = null; };
showMap();
