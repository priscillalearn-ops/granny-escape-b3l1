<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>單字精靈探險</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Noto+Sans+TC:wght@400;700;900&display=swap">
<style>
/* 原創「單字精靈」：每個單字是一隻用程式畫的精靈。
   地圖（3 區）→ 遇到野生精靈 → 答對收服、答錯逃走 → 精靈筆記收集 → 特訓 3 次進化 */
:root{
  --bg:#eef7f0; --card:#ffffff; --ink:#20302a; --sub:#5f7068; --line:#d3e4d9;
  --pri:#2fa36b; --priD:#1f7a4f; --good:#2e9e5b; --bad:#d9443b; --gold:#f5b301;
  --opt:#f3f9f5; --optH:#e1f1e7; --shadow:0 4px 0 #c3d9cb;
  --display:"Baloo 2","Noto Sans TC",system-ui,sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1714; --card:#1a2621; --ink:#eef6f1; --sub:#9fb5aa; --line:#2c3d35;
  --pri:#4cc488; --priD:#2f9663; --good:#4cc27e; --bad:#ff6b5f; --gold:#ffc83a;
  --opt:#22312a; --optH:#2b3f35; --shadow:0 4px 0 #080d0b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1714; --card:#1a2621; --ink:#eef6f1; --sub:#9fb5aa; --line:#2c3d35;
  --pri:#4cc488; --priD:#2f9663; --good:#4cc27e; --bad:#ff6b5f; --gold:#ffc83a;
  --opt:#22312a; --optH:#2b3f35; --shadow:0 4px 0 #080d0b; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
h1{font-family:var(--display);font-size:32px;line-height:1.1;margin:8px 0 2px;text-align:center}
.tag{text-align:center;color:var(--sub);margin:0 0 16px;font-size:15px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:14px;font-weight:700;background:var(--pri);color:#fff;box-shadow:0 4px 0 var(--priD);min-height:48px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--priD)}
.btn.ghost{background:var(--opt);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1 1 140px}
.full{width:100%}

/* 場景（三個區域的天空與地面） */
.scene{position:relative;border-radius:18px;overflow:hidden;border:2px solid var(--line)}
.sc-forest{background:linear-gradient(#bfe8ff 0%,#e6f7ff 55%,#9fdc8a 55%,#6fbf5d 100%)}
.sc-ocean{background:linear-gradient(#ffe2b8 0%,#bfe9ff 40%,#4fb6e3 52%,#2a86c2 100%)}
.sc-space{background:radial-gradient(circle at 20% 25%,#fff 0 1.5px,transparent 2px),radial-gradient(circle at 70% 15%,#fff 0 1px,transparent 2px),radial-gradient(circle at 85% 45%,#fff 0 1.5px,transparent 2px),radial-gradient(circle at 40% 10%,#ffd 0 1px,transparent 2px),linear-gradient(#1b1846 0%,#3b2c78 60%,#8a6bc9 60%,#6b4fb0 100%)}
.sc-review{background:linear-gradient(#ffe9c7 0%,#fff6e6 55%,#f2c98d 55%,#e2ad62 100%)}

/* 地圖卡片 */
.area{padding:0;overflow:hidden}
.area .scene{border:0;border-radius:0;height:118px;display:flex;align-items:flex-end;justify-content:center;gap:4px;padding-bottom:6px}
.area .scene svg{width:62px;height:62px}
.area .info{padding:12px 16px 16px}
.area h2{margin:0;font-size:20px}
.lx{display:inline-block;font-size:13px;font-weight:700;color:var(--pri);background:var(--opt);border-radius:999px;padding:1px 10px;margin-left:6px;vertical-align:2px}
.area p{margin:2px 0 0;color:var(--sub);font-size:14px}
.stars{color:var(--gold);letter-spacing:2px;font-size:18px}
.locked .scene{filter:grayscale(1) brightness(.85)}
.locked .info{opacity:.6}
.lockmsg{position:absolute;inset:0;display:grid;place-items:center;font-size:40px}

/* 精靈 */
.sil{filter:brightness(0);opacity:.22}
.bob{animation:bob 1.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.caught-anim{animation:caught .9s ease-in forwards}
@keyframes caught{0%{transform:scale(1)}30%{transform:scale(1.15) translateY(-12px)}100%{transform:scale(.05) translateY(40px) rotate(360deg);opacity:0}}
.flee-anim{animation:flee .8s ease-in forwards}
@keyframes flee{0%{transform:none}20%{transform:translateX(-10px)}100%{transform:translateX(260px) translateY(-20px);opacity:0}}
.pop-anim{animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}

/* 遭遇畫面 */
.hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700}
.hearts{font-size:22px;letter-spacing:2px}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--pri);width:0;transition:width .3s}
.enc{height:210px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:12px}
.enc .mon{width:150px;height:150px;margin-bottom:10px}
.enc .mon svg{width:100%;height:100%}
.say{position:absolute;left:12px;top:12px;right:12px;background:rgba(255,255,255,.92);color:#20302a;border-radius:14px;padding:6px 12px;font-weight:700;font-size:15px;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.sparkle{position:absolute;inset:0;pointer-events:none;display:grid;place-items:center;font-size:56px}
.qtype{font-size:14px;color:var(--sub);font-weight:700}
.prompt{font-size:30px;font-weight:900;margin:4px 0;word-break:break-word}
.prompt.sent{font-size:21px;font-weight:700;line-height:1.5}
.blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--pri);margin:0 4px}
.speak{font-size:15px;padding:6px 12px;border-radius:999px;background:var(--opt);font-weight:700;margin-top:4px}
.big-speak{font-size:44px;width:88px;height:88px;border-radius:50%;background:var(--opt);display:grid;place-items:center;margin:4px auto}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.opt{text-align:center;padding:12px 10px;border-radius:14px;background:var(--opt);border:2px solid var(--line);font-size:19px;font-weight:700;min-height:58px;word-break:break-word}
.opt:hover:not(:disabled){background:var(--optH)}
.opt.ok{background:var(--good);border-color:var(--good);color:#fff}
.opt.no{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.fb{margin-top:12px;padding:12px 14px;border-radius:14px;font-size:16px}
.fb.ok{background:color-mix(in srgb,var(--good) 15%,transparent)}
.fb.no{background:color-mix(in srgb,var(--bad) 13%,transparent)}
.fb b{font-size:18px}
.fb .ex{color:var(--sub);margin-top:4px}

/* 精靈筆記 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.slot{background:var(--opt);border:2px solid var(--line);border-radius:14px;padding:6px 4px 8px;text-align:center}
.slot svg{width:72px;height:72px;display:block;margin:0 auto}
.slot .nm{font-weight:900;font-size:15px;line-height:1.2}
.slot .fr{font-size:11px;letter-spacing:1px}
.slot.evo{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,var(--opt))}
.sec{margin:16px 0 8px;font-size:17px}
.word{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.word:last-child{border-bottom:0}
.word svg{width:52px;height:52px;flex:none}
.word .en{font-size:20px;font-weight:900}
.word .zh{font-weight:700}
.word .pos{color:var(--sub);font-size:14px;margin-left:4px}
.word .ex{color:var(--sub);font-size:14px}
.detail{text-align:center}
.detail .big svg{width:190px;height:190px}
.result{text-align:center}
.result .big{font-size:50px;letter-spacing:6px;color:var(--gold);margin:4px 0}
.team{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin-top:8px}
.team svg{width:54px;height:54px}
.note{font-size:13px;color:var(--sub);text-align:center;margin-top:20px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.link{color:var(--pri);font-weight:700;padding:8px 4px}
.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.bob,.caught-anim,.flee-anim,.pop-anim,.shake{animation:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>


<script>
/* =========================================================
   給老師／維護者：只要改這一段的單字就能換題庫。
   每個字：w 英文、zh 中文、pos 詞性、ex 例句（例句裡要「原封不動」出現 w，
   填空題才挖得掉）、exZh 例句中譯。每關 10 個字。
   ※ 下面是示範用單字，依小六程度挑選，並非官方 Lexile 字表。
   ========================================================= */
const STAGES = [
  { id:'forest', name:'魔法森林', icon:'🌳', lexile:'300L–400L', desc:'日常生活單字', words:[
    {w:'brave',   zh:'勇敢的', pos:'adj.', ex:'The brave boy helped the lost dog.', exZh:'那個勇敢的男孩幫助了走失的狗。'},
    {w:'hungry',  zh:'餓的',   pos:'adj.', ex:'I am hungry, so I want to eat lunch now.', exZh:'我餓了，所以現在想吃午餐。'},
    {w:'quiet',   zh:'安靜的', pos:'adj.', ex:'Please be quiet in the library.', exZh:'在圖書館裡請保持安靜。'},
    {w:'carry',   zh:'搬；提', pos:'v.',   ex:'Can you carry this box for me?', exZh:'你可以幫我搬這個箱子嗎？'},
    {w:'shout',   zh:'大喊',   pos:'v.',   ex:'Please don\'t shout in the classroom.', exZh:'請不要在教室裡大喊。'},
    {w:'forest',  zh:'森林',   pos:'n.',   ex:'Many animals live in the forest.', exZh:'很多動物住在森林裡。'},
    {w:'smile',   zh:'微笑',   pos:'n.',   ex:'She has a big smile on her face.', exZh:'她臉上掛著大大的微笑。'},
    {w:'travel',  zh:'旅行',   pos:'v.',   ex:'We travel to Tainan every summer.', exZh:'我們每年夏天都去台南旅行。'},
    {w:'heavy',   zh:'重的',   pos:'adj.', ex:'This bag is too heavy for me.', exZh:'這個包包對我來說太重了。'},
    {w:'afraid',  zh:'害怕的', pos:'adj.', ex:'My little sister is afraid of the dark.', exZh:'我妹妹怕黑。'},
  ]},
  { id:'ocean', name:'神祕海洋', icon:'🐋', lexile:'400L–550L', desc:'故事與自然單字', words:[
    {w:'discover', zh:'發現',     pos:'v.',   ex:'Scientists discover new fish in the ocean every year.', exZh:'科學家每年都在海裡發現新的魚。'},
    {w:'journey',  zh:'旅程',     pos:'n.',   ex:'The journey across the sea took ten days.', exZh:'橫越大海的旅程花了十天。'},
    {w:'curious',  zh:'好奇的',   pos:'adj.', ex:'The curious cat looked inside the box.', exZh:'那隻好奇的貓往箱子裡看。'},
    {w:'protect',  zh:'保護',     pos:'v.',   ex:'We should protect the sea turtles.', exZh:'我們應該保護海龜。'},
    {w:'dangerous',zh:'危險的',   pos:'adj.', ex:'It is dangerous to swim alone.', exZh:'獨自游泳很危險。'},
    {w:'island',   zh:'島嶼',     pos:'n.',   ex:'Taiwan is a beautiful island.', exZh:'台灣是一座美麗的島嶼。'},
    {w:'gather',   zh:'收集；聚集',pos:'v.',  ex:'The children gather shells on the beach.', exZh:'孩子們在沙灘上撿貝殼。'},
    {w:'disappear',zh:'消失',     pos:'v.',   ex:'The boat began to disappear into the fog.', exZh:'那艘船開始消失在霧中。'},
    {w:'surface',  zh:'表面',     pos:'n.',   ex:'The whale came up to the surface of the water.', exZh:'鯨魚浮到了水面上。'},
    {w:'patient',  zh:'有耐心的', pos:'adj.', ex:'Be patient. The fish will come soon.', exZh:'要有耐心，魚很快就會來。'},
  ]},
  { id:'space', name:'星際太空', icon:'🚀', lexile:'550L–700L', desc:'知識性文章單字', words:[
    {w:'explore',    zh:'探索',   pos:'v.',   ex:'Astronauts explore space in a rocket.', exZh:'太空人搭火箭探索太空。'},
    {w:'enormous',   zh:'巨大的', pos:'adj.', ex:'Jupiter is an enormous planet.', exZh:'木星是一顆巨大的行星。'},
    {w:'observe',    zh:'觀察',   pos:'v.',   ex:'We observe the moon with a telescope.', exZh:'我們用望遠鏡觀察月亮。'},
    {w:'ancient',    zh:'古老的', pos:'adj.', ex:'People in ancient times also looked at the stars.', exZh:'古時候的人也會看星星。'},
    {w:'distance',   zh:'距離',   pos:'n.',   ex:'The distance from Earth to the moon is very long.', exZh:'地球到月球的距離非常遠。'},
    {w:'survive',    zh:'存活',   pos:'v.',   ex:'Plants cannot survive without water.', exZh:'植物沒有水就無法存活。'},
    {w:'launch',     zh:'發射',   pos:'v.',   ex:'They will launch the rocket tomorrow morning.', exZh:'他們明天早上會發射火箭。'},
    {w:'mysterious', zh:'神祕的', pos:'adj.', ex:'Black holes are very mysterious.', exZh:'黑洞非常神祕。'},
    {w:'temperature',zh:'溫度',   pos:'n.',   ex:'The temperature on Mars is very low.', exZh:'火星上的溫度非常低。'},
    {w:'scientist',  zh:'科學家', pos:'n.',   ex:'My dream is to become a scientist.', exZh:'我的夢想是成為科學家。'},
  ]},
];
const HEARTS = 3;          // 每趟冒險幾顆心
const EVOLVE_AT = 3;       // 同一個字累積答對幾次會進化
const SAVE_KEY = 'lexile_sprites_v1';

/* ---------- 存檔（只存在這台裝置的瀏覽器） ---------- */
function load(){ try{ return JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; }catch(e){ return {}; } }
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
// stars[區域id]=0..3；friend[字]=累積答對次數（≥1 收服、≥EVOLVE_AT 進化）；wrong[字]=逃走次數
const S = Object.assign({ stars:{}, friend:{}, wrong:{} }, load());

/* ---------- 小工具 ---------- */
const $app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = (a,n) => shuffle(a).slice(0,n);
const allWords = STAGES.flatMap(s => s.words.map(x => Object.assign(x, { area:s.id })));
const findWord = w => allWords.find(x => x.w === w);
const starStr = n => '★'.repeat(n) + '☆'.repeat(3-n);
const unlocked = i => i === 0 || (S.stars[STAGES[i-1].id] || 0) > 0;
const isCaught = w => (S.friend[w] || 0) >= 1;
const isEvo = w => (S.friend[w] || 0) >= EVOLVE_AT;
const friendStr = w => { const n = Math.min(S.friend[w]||0, EVOLVE_AT); return '💚'.repeat(n) + '🤍'.repeat(EVOLVE_AT-n); };

const canSpeak = 'speechSynthesis' in window;
let voice = null;
function speak(text){
  if(!canSpeak) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.85;
  if(!voice) voice = speechSynthesis.getVoices().find(v => /en[-_]US/i.test(v.lang)) || null;
  if(voice) u.voice = voice;
  speechSynthesis.speak(u);
}

/* =========================================================
   原創精靈產生器：同一個單字永遠畫出同一隻精靈。
   身形 3 種 × 配件 3 種 × 配色 4 種 × 眼睛／嘴巴變化，依所在區域換主題。
   ========================================================= */
function rngFrom(str){
  let h = 2166136261;
  for(const c of str){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  return () => { h += 0x6D2B79F5; let t = h; t = Math.imul(t ^ t>>>15, t|1); t ^= t + Math.imul(t ^ t>>>7, t|61); return ((t ^ t>>>14)>>>0) / 4294967296; };
}
const PAL = {
  forest:[['#7bd389','#3f9a52','#d4f5d8'],['#f6d55c','#c9a227','#fff3c4'],['#a8d86b','#5c9e2e','#e3f6cf'],['#f4a261','#c66a26','#ffe3c9']],
  ocean: [['#5ec8f2','#2386b5','#d2f1ff'],['#58d1c9','#1f958d','#d0f6f2'],['#8fb8ff','#4a73c9','#e2ebff'],['#ff9aa8','#d45b6d','#ffe3e8']],
  space: [['#b18cf2','#7148c2','#ebe0ff'],['#ff8fd0','#c94a95','#ffe3f4'],['#7f8cff','#4553c9','#e0e3ff'],['#ffd166','#c99a21','#fff2c9']],
};
const OL = '#2b2b3d';
function sprite(word, opts = {}){
  const x = findWord(word) || { area:'forest' };
  const r = rngFrom(word);
  const theme = x.area, [main, dark, light] = PAL[theme][Math.floor(r()*4)];
  const shape = Math.floor(r()*3), acc = Math.floor(r()*3), mouth = Math.floor(r()*3);
  const eyeR = 7 + r()*2.5, eyeGap = 13 + r()*5;
  const evo = opts.evo;
  const top = [42, 32, 44][shape];
  const st = `stroke="${OL}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"`;
  let back = '', front = '';

  // 主題配件
  if(theme === 'forest'){
    if(acc === 0) front += `<path d="M60 ${top} L60 ${top-12}" ${st} fill="none"/><path d="M60 ${top-12} C 48 ${top-28}, 30 ${top-16}, 40 ${top-8} C 48 ${top-4}, 56 ${top-8}, 60 ${top-12} Z" fill="${dark}" ${st}/><path d="M60 ${top-12} C 70 ${top-24}, 84 ${top-18}, 78 ${top-9} C 72 ${top-4}, 64 ${top-8}, 60 ${top-12} Z" fill="${main}" ${st}/>`;
    if(acc === 1) back += `<circle cx="37" cy="${top+6}" r="11" fill="${main}" ${st}/><circle cx="83" cy="${top+6}" r="11" fill="${main}" ${st}/><circle cx="37" cy="${top+6}" r="5" fill="${light}"/><circle cx="83" cy="${top+6}" r="5" fill="${light}"/>`;
    if(acc === 2) front += `<g transform="translate(60 ${top-6})">${[0,72,144,216,288].map(a=>`<ellipse cx="0" cy="-8" rx="5.5" ry="8" fill="#ff9fb8" ${st} transform="rotate(${a})"/>`).join('')}<circle r="5" fill="#ffd34d" ${st}/></g>`;
  }else if(theme === 'ocean'){
    if(acc === 0) back += `<path d="M48 ${top+6} Q 60 ${top-24} 76 ${top+4} Z" fill="${dark}" ${st}/>`;
    if(acc === 1) back += `<ellipse cx="24" cy="78" rx="14" ry="7" fill="${dark}" ${st} transform="rotate(-30 24 78)"/><ellipse cx="96" cy="78" rx="14" ry="7" fill="${dark}" ${st} transform="rotate(30 96 78)"/>`;
    if(acc === 2) front += `<path d="M60 ${top} Q 66 ${top-10} 60 ${top-18}" ${st} fill="none"/><circle cx="60" cy="${top-22}" r="6" fill="#e9fbff" ${st}/><circle cx="58" cy="${top-24}" r="1.8" fill="#fff"/>`;
  }else{
    if(acc === 0) front += `<path d="M60 ${top} L60 ${top-14}" ${st} fill="none"/><path d="M60 ${top-27} l3.5 7.5 8 .8 -6 5.4 1.8 7.8 -7.3 -4 -7.3 4 1.8 -7.8 -6 -5.4 8 -.8z" fill="#ffd34d" ${st}/>`;
    if(acc === 1) front += `<path d="M50 ${top+3} L42 ${top-12}" ${st} fill="none"/><path d="M70 ${top+3} L78 ${top-12}" ${st} fill="none"/><circle cx="42" cy="${top-14}" r="5" fill="${light}" ${st}/><circle cx="78" cy="${top-14}" r="5" fill="${light}" ${st}/>`;
    if(acc === 2){ back += `<path d="M10 80 A 50 11 0 0 1 110 80" fill="none" stroke="${OL}" stroke-width="9"/><path d="M10 80 A 50 11 0 0 1 110 80" fill="none" stroke="#ffd34d" stroke-width="4"/>`;
                   front += `<path d="M10 80 A 50 11 0 0 0 110 80" fill="none" stroke="${OL}" stroke-width="9"/><path d="M10 80 A 50 11 0 0 0 110 80" fill="none" stroke="#ffd34d" stroke-width="4"/>`; }
  }

  // 身體
  const body = [
    `<ellipse cx="60" cy="74" rx="36" ry="32" fill="${main}" ${st}/>`,
    `<path d="M60 32 C 84 46, 98 70, 92 88 C 86 104, 34 104, 28 88 C 22 70, 36 46, 60 32 Z" fill="${main}" ${st}/>`,
    `<rect x="26" y="44" width="68" height="60" rx="30" fill="${main}" ${st}/>`,
  ][shape];
  const feet = `<ellipse cx="45" cy="104" rx="9" ry="5" fill="${dark}" ${st}/><ellipse cx="75" cy="104" rx="9" ry="5" fill="${dark}" ${st}/>`;
  const belly = `<ellipse cx="60" cy="86" rx="19" ry="12" fill="${light}"/>`;
  const ey = 68;
  const eye = cx => `<ellipse cx="${cx}" cy="${ey}" rx="${eyeR}" ry="${eyeR+1}" fill="#fff" ${st}/><circle cx="${cx+1}" cy="${ey+1}" r="${eyeR*0.55}" fill="${OL}"/><circle cx="${cx+2.6}" cy="${ey-1.6}" r="1.8" fill="#fff"/>`;
  const cheeks = `<ellipse cx="${60-eyeGap-9}" cy="80" rx="5" ry="3" fill="#ff7f9a" opacity=".55"/><ellipse cx="${60+eyeGap+9}" cy="80" rx="5" ry="3" fill="#ff7f9a" opacity=".55"/>`;
  const mouthSvg = [
    `<path d="M54 79 Q 60 85 66 79" fill="none" ${st}/>`,
    `<ellipse cx="60" cy="81" rx="3.5" ry="4" fill="#c2405e" ${st}/>`,
    `<path d="M53 79 Q 56.5 83 60 79 Q 63.5 83 67 79" fill="none" ${st}/>`,
  ][mouth];

  // 進化：皇冠＋閃光
  const crown = evo ? `<path d="M44 ${top-2} L46 ${top-16} L53 ${top-8} L60 ${top-20} L67 ${top-8} L74 ${top-16} L76 ${top-2} Z" fill="#ffd34d" ${st}/>
    <path d="M14 30 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z M104 46 l1.6 4 4 1.6 -4 1.6 -1.6 4 -1.6 -4 -4 -1.6 4 -1.6z M100 14 l1.3 3 3 1.3 -3 1.3 -1.3 3 -1.3 -3 -3 -1.3 3 -1.3z" fill="#ffd34d"/>` : '';

  const scale = evo ? 'transform="translate(60 70) scale(1.06) translate(-60 -70)"' : '';
  return `<svg viewBox="0 -4 120 124" class="${opts.cls||''}" aria-label="${esc(word)} 精靈" role="img"><g ${scale}>${back}${feet}${body}${belly}${eye(60-eyeGap)}${eye(60+eyeGap)}${cheeks}${mouthSvg}${front}${crown}</g></svg>`;
}
// 依收服狀態畫：沒收服過 → 剪影
const spriteFor = (w, cls='') => isCaught(w) ? sprite(w, { evo:isEvo(w), cls }) : sprite(w, { cls:'sil '+cls });

/* ---------- 畫面：地圖 ---------- */
function showMap(){
  const total = allWords.length, got = allWords.filter(x => isCaught(x.w)).length;
  $app.innerHTML = `
    <h1>🌱 單字精靈探險</h1>
    <p class="tag">答對單字，收服原創精靈！　精靈筆記 <b>${got} / ${total}</b></p>
    ${STAGES.map((st,i) => {
      const open = unlocked(i), stars = S.stars[st.id] || 0;
      const n = st.words.filter(x => isCaught(x.w)).length;
      const peek = st.words.slice(0,4).map(x => spriteFor(x.w)).join('');
      return `<div class="card area ${open?'':'locked'}">
        <div class="scene sc-${st.id}">${peek}${open?'':'<div class="lockmsg">🔒</div>'}</div>
        <div class="info">
          <h2>${st.icon} 第 ${i+1} 區　${esc(st.name)}<span class="lx">${esc(st.lexile)}</span></h2>
          <p>${esc(st.desc)}・收服 ${n} / ${st.words.length} 隻　<span class="stars">${starStr(stars)}</span></p>
          ${open
            ? `<div class="row" style="margin-top:12px"><button class="btn ghost" data-learn="${i}">📖 預習單字</button><button class="btn" data-play="${i}">▶ 出發冒險</button></div>`
            : `<p style="margin-top:8px">通過上一區（拿到至少 1 顆星）才會開啟</p>`}
        </div>
      </div>`;
    }).join('')}
    <div class="row">
      <button class="btn ghost" id="toBook">📘 精靈筆記</button>
      <button class="btn ghost" id="toHelp">❓ 怎麼玩</button>
    </div>
    <p class="note">精靈都是原創角色。進度只存在這台裝置的瀏覽器，不會上傳。<br>示範單字依小六程度挑選，並非官方 Lexile 字表。</p>`;
  $app.querySelectorAll('[data-learn]').forEach(b => b.onclick = () => showLearn(+b.dataset.learn));
  $app.querySelectorAll('[data-play]').forEach(b => b.onclick = () => startStage(+b.dataset.play));
  document.getElementById('toBook').onclick = showBook;
  document.getElementById('toHelp').onclick = showHelp;
  scrollTo(0,0);
}

function topbar(title, back = showMap){
  setTimeout(() => { const b = document.getElementById('back'); if(b && !b.onclick) b.onclick = back; });
  return `<div class="topbar"><button class="link" id="back">← 返回</button><b>${esc(title)}</b><span style="width:60px"></span></div>`;
}
function wordRow(x, extra=''){
  return `<div class="word">
    ${spriteFor(x.w)}
    <div style="flex:1">
      <div><span class="en">${esc(x.w)}</span><span class="pos">${esc(x.pos)}</span>　<span class="zh">${esc(x.zh)}</span>${extra}</div>
      <div class="ex">${esc(x.ex)}<br>${esc(x.exZh)}</div>
    </div>
    ${canSpeak ? `<button class="speak" data-say="${esc(x.w)}">🔊</button>` : ''}
  </div>`;
}
function bindSay(){ $app.querySelectorAll('[data-say]').forEach(b => b.onclick = e => { e.stopPropagation(); speak(b.dataset.say); }); }

/* ---------- 畫面：預習 ---------- */
function showLearn(i){
  const st = STAGES[i];
  $app.innerHTML = `${topbar(st.icon+' '+st.name)}
    <p style="color:var(--sub);margin:0 0 10px;font-size:15px">這一區住著 ${st.words.length} 隻單字精靈。先把字記熟，冒險時比較容易收服牠們！</p>
    <div class="card">${st.words.map(x => wordRow(x)).join('')}</div>
    <button class="btn full" id="go">準備好了，出發冒險 ▶</button>`;
  document.getElementById('go').onclick = () => startStage(i);
  bindSay(); scrollTo(0,0);
}

/* ---------- 出題 ---------- */
const TYPES = ['en2zh','zh2en','listen','fill'];
const TYPE_LABEL = { en2zh:'看英文，選中文', zh2en:'看中文，選英文', listen:'聽發音，選單字', fill:'例句填空' };
function makeQuestion(x, pool, type){
  if(type === 'listen' && !canSpeak) type = 'zh2en';
  if(pool.length < 4) pool = allWords;
  const opts = shuffle([x, ...pick(pool.filter(y => y.w !== x.w), 3)]);
  return { word:x, type, opts, answer:x.w, labels: opts.map(o => type === 'en2zh' ? o.zh : o.w) };
}

/* ---------- 畫面：冒險（一題＝遇到一隻精靈） ---------- */
let G = null;
function startRun(meta, words, pool){
  const types = shuffle([...TYPES, ...TYPES, ...TYPES]);
  G = Object.assign({ qs: shuffle(words).map((x,k) => makeQuestion(x, pool, types[k % types.length])),
        k:0, hearts:HEARTS, right:0, caughtNow:[], evoNow:[], fled:[] }, meta);
  showQ();
}
function startStage(i){ const st = STAGES[i]; startRun({ i, st, scene:st.id }, st.words, st.words); }

function showQ(){
  const q = G.qs[G.k], x = q.word;
  const met = isCaught(x.w);
  let promptHtml;
  if(q.type === 'en2zh') promptHtml = `<div class="prompt">${esc(x.w)}</div>${canSpeak?`<button class="speak" data-say="${esc(x.w)}">🔊 聽發音</button>`:''}`;
  else if(q.type === 'zh2en') promptHtml = `<div class="prompt">${esc(x.zh)} <span style="font-size:16px;color:var(--sub)">${esc(x.pos)}</span></div>`;
  else if(q.type === 'listen') promptHtml = `<button class="big-speak" data-say="${esc(x.w)}" aria-label="再聽一次">🔊</button><p style="text-align:center;color:var(--sub);margin:0;font-size:14px">點喇叭可以再聽一次</p>`;
  else {
    const p = x.ex.split(x.w);
    promptHtml = `<div class="prompt sent">${esc(p[0])}<span class="blank">&nbsp;</span>${esc(p.slice(1).join(x.w))}</div><div style="color:var(--sub);font-size:15px">${esc(x.exZh)}</div>`;
  }
  const leave = () => { if(confirm('確定要離開嗎？這趟冒險的進度不會保留。')) showMap(); };
  $app.innerHTML = `${topbar(G.st.icon+' '+G.st.name, leave)}
    <div class="hud"><span class="hearts">${'❤️'.repeat(G.hearts)}${'🤍'.repeat(HEARTS-G.hearts)}</span><span>${G.k+1} / ${G.qs.length}</span></div>
    <div class="bar"><i style="width:${G.k/G.qs.length*100}%"></i></div>
    <div class="scene sc-${G.scene} enc">
      <div class="say" id="say">${met ? `又遇到 <b>${esc(x.w)}</b> 精靈了！答對可以提升好感度 💚` : '野生的單字精靈出現了！答對就能收服牠！'}</div>
      <div class="mon bob pop-anim" id="mon">${sprite(x.w, { evo:isEvo(x.w) })}</div>
      <div class="sparkle" id="fx"></div>
    </div>
    <div class="card" id="qcard">
      <div class="qtype">${TYPE_LABEL[q.type]}</div>
      ${promptHtml}
      <div class="opts">${q.labels.map((l,j) => `<button class="opt" data-j="${j}">${esc(l)}</button>`).join('')}</div>
      <div id="fb"></div>
    </div>`;
  bindSay();
  $app.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.j));
  if(q.type === 'listen') setTimeout(() => speak(x.w), 300);
}

function answer(j){
  const q = G.qs[G.k], x = q.word;
  const ok = q.opts[j].w === q.answer;
  const btns = $app.querySelectorAll('.opt');
  btns.forEach((b,n) => { b.disabled = true; if(q.opts[n].w === q.answer) b.classList.add('ok'); });
  const mon = document.getElementById('mon'), say = document.getElementById('say'), fx = document.getElementById('fx');
  let msg;
  if(ok){
    G.right++;
    const before = S.friend[x.w] || 0;
    S.friend[x.w] = before + 1;
    if(S.wrong[x.w]){ S.wrong[x.w]--; if(S.wrong[x.w] <= 0) delete S.wrong[x.w]; }
    mon.classList.remove('bob','pop-anim'); mon.classList.add('caught-anim');
    fx.textContent = '✨';
    if(before === 0){ G.caughtNow.push(x.w); msg = `🎉 收服了 <b>${esc(x.w)}</b> 精靈！`; }
    else if(before + 1 === EVOLVE_AT){ G.evoNow.push(x.w); msg = `🌟 <b>${esc(x.w)}</b> 精靈進化了！`; }
    else msg = `💚 <b>${esc(x.w)}</b> 精靈的好感度提升了！`;
    say.innerHTML = msg;
  }else{
    btns[j].classList.add('no');
    document.getElementById('qcard').classList.add('shake');
    G.hearts--; G.fled.push(x.w);
    S.wrong[x.w] = (S.wrong[x.w] || 0) + 1;
    mon.classList.remove('bob','pop-anim'); mon.classList.add('flee-anim');
    say.innerHTML = `💨 <b>${esc(x.w)}</b> 精靈逃走了……到「精靈筆記」可以再把牠找回來`;
  }
  save();
  if(q.type !== 'listen' && canSpeak) speak(x.w);
  const last = G.k === G.qs.length - 1 || G.hearts <= 0;
  document.getElementById('fb').innerHTML = `<div class="fb ${ok?'ok':'no'}">
      ${ok ? '✅ 答對了！' : '❌ 正確答案是：'} <b>${esc(x.w)}</b> ${esc(x.pos)} ${esc(x.zh)}
      <div class="ex">${esc(x.ex)}<br>${esc(x.exZh)}</div>
    </div>
    <button class="btn full" style="margin-top:12px" id="next">${last ? '看冒險結果' : '繼續前進 →'}</button>`;
  const nb = document.getElementById('next');
  nb.onclick = () => { if(last) showResult(); else { G.k++; showQ(); } };
}

/* ---------- 畫面：結算 ---------- */
function showResult(){
  const pass = G.hearts > 0;
  const stars = pass ? G.hearts : 0;
  const isStage = G.i >= 0;
  const prev = isStage ? (S.stars[G.st.id] || 0) : 0;
  if(isStage && stars > prev){ S.stars[G.st.id] = stars; save(); }
  const nextOpen = isStage && pass && G.i < STAGES.length - 1;
  const fled = [...new Set(G.fled)].map(findWord);
  $app.innerHTML = `
    <div class="card result">
      <div class="scene sc-${G.scene}" style="height:120px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px">
        ${(G.caughtNow.length || G.evoNow.length) ? [...G.evoNow, ...G.caughtNow].slice(0,6).map(w => sprite(w,{evo:isEvo(w),cls:'bob'})).join('').replace(/<svg /g,'<svg style="width:64px;height:64px" ') : '<div style="font-size:56px">💪</div>'}
      </div>
      <h2 style="margin:10px 0 0">${pass ? '冒險成功！' : '體力用完了，休息一下再出發！'}</h2>
      ${isStage ? `<div class="big">${starStr(stars)}</div>` : ''}
      <p style="margin:0">答對 ${G.right} 題・新收服 <b>${G.caughtNow.length}</b> 隻・進化 <b>${G.evoNow.length}</b> 隻</p>
      ${isStage && stars > prev && prev > 0 ? '<p style="color:var(--good);font-weight:700;margin:6px 0 0">刷新最佳紀錄！</p>' : ''}
      ${nextOpen && prev === 0 ? `<p style="color:var(--pri);font-weight:700;margin:6px 0 0">🔓 第 ${G.i+2} 區「${esc(STAGES[G.i+1].name)}」開啟了！</p>` : ''}
    </div>
    ${fled.length ? `<div class="card"><b>💨 逃走的精靈（再複習一下）</b>${fled.map(x => wordRow(x)).join('')}</div>` : ''}
    <div class="row">
      <button class="btn ghost" id="again">🔁 再冒險一次</button>
      ${nextOpen ? `<button class="btn" id="next">前往下一區 ▶</button>` : `<button class="btn" id="map">回地圖</button>`}
    </div>`;
  bindSay();
  const again = G.again || (() => startStage(G.i));
  document.getElementById('again').onclick = again;
  const n = document.getElementById('next'); if(n) n.onclick = () => startStage(G.i + 1);
  const m = document.getElementById('map'); if(m) m.onclick = showMap;
  scrollTo(0,0);
}

/* ---------- 畫面：精靈筆記 ---------- */
function showBook(){
  const fled = Object.keys(S.wrong).map(findWord).filter(Boolean);
  const train = allWords.filter(x => isCaught(x.w) && !isEvo(x.w));
  const evoN = allWords.filter(x => isEvo(x.w)).length;
  $app.innerHTML = `${topbar('📘 精靈筆記')}
    <p style="color:var(--sub);margin:0 0 10px;font-size:15px">已收服 <b>${allWords.filter(x=>isCaught(x.w)).length}</b> / ${allWords.length} 隻・已進化 <b>${evoN}</b> 隻。同一隻精靈累積答對 ${EVOLVE_AT} 次就會進化 👑</p>
    <div class="row" style="margin-bottom:6px">
      <button class="btn" id="hunt" ${fled.length ? '' : 'disabled style="opacity:.45"'}>💨 找回精靈（${fled.length}）</button>
      <button class="btn ghost" id="train" ${train.length ? '' : 'disabled style="opacity:.45"'}>💪 精靈特訓（${train.length}）</button>
    </div>
    ${STAGES.map(st => `<h3 class="sec">${st.icon} ${esc(st.name)}</h3>
      <div class="grid">${st.words.map(x => {
        const c = isCaught(x.w);
        return `<button class="slot ${isEvo(x.w)?'evo':''}" data-w="${esc(x.w)}" ${c?'':'disabled'}>
          ${spriteFor(x.w)}
          <div class="nm">${c ? esc(x.w) : '？？？'}</div>
          <div class="fr">${c ? friendStr(x.w) : '&nbsp;'}</div>
        </button>`;
      }).join('')}</div>`).join('')}`;
  $app.querySelectorAll('[data-w]').forEach(b => b.onclick = () => showDetail(b.dataset.w));
  const runMode = (name, words) => {
    const ws = words.slice(0,10);
    const go = () => startRun({ i:-1, st:{ id:'_r', name, icon:'📘' }, scene:'review', again:go }, ws, ws);
    go();
  };
  if(fled.length) document.getElementById('hunt').onclick = () => runMode('找回逃走的精靈', shuffle(fled));
  if(train.length) document.getElementById('train').onclick = () => runMode('精靈特訓', shuffle(train));
  scrollTo(0,0);
}

function showDetail(w){
  const x = findWord(w);
  $app.innerHTML = `${topbar('📘 精靈筆記', showBook)}
    <div class="card detail">
      <div class="scene sc-${x.area}" style="padding-top:8px"><div class="big bob">${sprite(w,{evo:isEvo(w)})}</div></div>
      <h2 style="font-size:34px;margin:10px 0 0">${esc(x.w)} ${isEvo(w)?'👑':''}</h2>
      <p style="margin:0;font-size:19px"><span style="color:var(--sub)">${esc(x.pos)}</span>　<b>${esc(x.zh)}</b></p>
      <p style="margin:6px 0 0">好感度 ${friendStr(w)}${isEvo(w)?'　已進化！':`　再答對 ${EVOLVE_AT-(S.friend[w]||0)} 次會進化`}</p>
      <p style="color:var(--sub);margin:10px 0 0">${esc(x.ex)}<br>${esc(x.exZh)}</p>
      ${canSpeak ? `<div class="row" style="margin-top:12px"><button class="btn ghost" data-say="${esc(x.w)}">🔊 單字</button><button class="btn ghost" data-say="${esc(x.ex)}">🔊 例句</button></div>` : ''}
    </div>`;
  bindSay(); scrollTo(0,0);
}

/* ---------- 畫面：說明 ---------- */
function showHelp(){
  $app.innerHTML = `${topbar('❓ 怎麼玩')}
    <div class="card">
      <p style="margin-top:0">🗺️ 一共有 <b>3 個區域</b>，依藍思（Lexile）分級由淺到深，每區住著 10 隻單字精靈。</p>
      <p>🌱 冒險時每一題都會遇到一隻精靈：<b>答對就收服牠</b>，答錯牠會逃走、你也會少一顆心。</p>
      <p>❤️ 每趟冒險有 <b>3 顆心</b>。走完這一區時剩幾顆心就拿幾顆星，拿到星星會開啟下一區。</p>
      <p>👑 同一隻精靈累積答對 <b>${EVOLVE_AT} 次</b>會進化，戴上皇冠！到「精靈筆記」的「精靈特訓」可以加速進化。</p>
      <p>💨 逃走的精靈可以在「精靈筆記」裡把牠找回來（也就是錯題複習）。</p>
      <p style="margin-bottom:0">🧩 題型有四種：看英文選中文、看中文選英文、聽發音選單字、例句填空。</p>
    </div>
    <button class="btn ghost full" id="reset">清除這台裝置的進度</button>`;
  document.getElementById('reset').onclick = () => {
    if(confirm('確定要清除所有精靈、星星和紀錄嗎？')){ S.stars = {}; S.friend = {}; S.wrong = {}; save(); showMap(); }
  };
  scrollTo(0,0);
}

if(canSpeak) speechSynthesis.onvoiceschanged = () => { voice = null; };
showMap();
</script>
</body>
</html>
