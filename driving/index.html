<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>駕照ヨシ！</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+TC:wght@400;700;900&display=swap">
<style>
/* Layout: one narrow column like a phone game — HUD, illustrated scene strip, character + speech bubble, then the question card. */
:root{
  --bg:#edf3f8; --card:#ffffff; --ink:#3b302b; --sub:#7d6f67; --line:#e2dad3;
  --tint:#fff3cf; --maru:#e5483c; --batsu:#2d6fd2; --good:#2f9e55; --bad:#d8433a;
  --leafG:#35a852; --leafY:#f5c62b; --btn:#f7f2ec; --btnh:#efe6dc; --shadow:0 3px 0 #d8cfc6;
  --display:"Dela Gothic One","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#18202b; --card:#232d3b; --ink:#f3eee8; --sub:#a9b3c0; --line:#364353;
  --tint:#3a3524; --maru:#ff6a5c; --batsu:#5f9bf2; --good:#4cc277; --bad:#ff6a5c;
  --btn:#2c3848; --btnh:#354356; --shadow:0 3px 0 #111821; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#18202b; --card:#232d3b; --ink:#f3eee8; --sub:#a9b3c0; --line:#364353;
  --tint:#3a3524; --maru:#ff6a5c; --batsu:#5f9bf2; --good:#4cc277; --bad:#ff6a5c;
  --btn:#2c3848; --btnh:#354356; --shadow:0 3px 0 #111821; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--batsu);outline-offset:2px}

.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:2px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.lives{display:flex;gap:4px;align-items:center}
.lives svg{width:20px;height:26px;transition:opacity .3s,filter .3s}
.lives svg.lost{opacity:.25;filter:grayscale(1)}
.score{margin-left:auto;font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.icon-btn{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:2px 8px;font-size:13px;font-weight:700}

.scene{border-radius:18px;overflow:hidden;border:3px solid var(--line);background:#cfe9f7;line-height:0}
.scene svg{width:100%;height:auto;display:block}
.dash{animation:roll .6s linear infinite}
@keyframes roll{to{stroke-dashoffset:-40}}
.bob{animation:bob .5s ease-in-out infinite alternate;transform-box:fill-box}
@keyframes bob{to{transform:translateY(-2px)}}

.talk{display:flex;align-items:flex-end;gap:10px}
.who{flex:0 0 92px;width:92px}
.who svg{width:100%;height:auto;display:block}
.bubble{flex:1;min-width:0;position:relative;background:var(--tint);border:2px solid var(--line);border-radius:16px;padding:8px 14px;margin-bottom:14px}
.bubble::before{content:"";position:absolute;left:-10px;bottom:18px;border:8px solid transparent;border-right-color:var(--line);border-left:0}
.bubble .jp{font-family:var(--display);font-size:24px;line-height:1.25;display:block;text-wrap:balance}
.bubble .zh{font-size:13px;color:var(--sub)}
.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:.3}}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--sub);font-weight:700;letter-spacing:.04em}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--leafY),var(--leafG));transition:width .4s}
.fig{display:flex;justify-content:center}
.fig svg{width:min(150px,44vw);height:auto}
.fig.wide svg{width:min(260px,70vw)}
.q{font-size:19px;font-weight:700;line-height:1.55;text-wrap:pretty;margin:0}

.ox{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ox button{background:var(--btn);border:2px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:14px}
.ox .g{font-family:var(--display);font-size:52px;line-height:1.1}
.ox .m .g{color:var(--maru)} .ox .b .g{color:var(--batsu)}
.mc{display:flex;flex-direction:column;gap:10px}
.mc button{background:var(--btn);border:2px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;text-align:left;display:flex;gap:12px;align-items:center;font-size:16px;font-weight:700;line-height:1.45}
.mc .n{flex:0 0 30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:2px solid var(--line);font-family:var(--display);font-size:15px}
.ox button:hover:not(:disabled),.mc button:hover:not(:disabled){background:var(--btnh)}
.ox button:active:not(:disabled),.mc button:active:not(:disabled){transform:translateY(2px);box-shadow:none}
button.right{border-color:var(--good)!important;background:color-mix(in srgb,var(--good) 16%,var(--card))!important}
button.wrong{border-color:var(--bad)!important;background:color-mix(in srgb,var(--bad) 14%,var(--card))!important}
button:disabled{cursor:default}
button.dim{opacity:.5}

.fb{border-top:2px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.verdict{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.verdict b{font-family:var(--display);font-size:30px;line-height:1.1;font-weight:400}
.verdict.ok b{color:var(--good)} .verdict.ng b{color:var(--bad)}
.verdict span{font-weight:700;color:var(--sub)}
.exp{margin:0;font-size:15px}
.combo{font-family:var(--display);color:var(--maru);font-size:15px}

.big{appearance:none;border:0;border-radius:14px;background:var(--maru);color:#fff;font-weight:900;font-size:18px;padding:12px 18px;box-shadow:0 4px 0 color-mix(in srgb,var(--maru) 60%,#000)}
.big:active{transform:translateY(3px);box-shadow:none}
.big.sec{background:var(--btn);color:var(--ink);border:2px solid var(--line);box-shadow:var(--shadow)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .big{flex:1 1 160px}

.hero{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(40px,12vw,60px);line-height:1.05;margin:0;letter-spacing:.02em}
.hero h1 em{font-style:normal;color:var(--maru)}
.hero p{margin:0;color:var(--sub);font-weight:700}
.rules{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:15px}
.rules li{display:flex;gap:10px;align-items:baseline}
.rules li b{font-family:var(--display);font-weight:400;color:var(--batsu);flex:0 0 auto;min-width:3.2em}
.map{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.map span{font-size:13px;font-weight:700;border:2px solid var(--line);border-radius:10px;padding:2px 8px;background:var(--btn)}
.map span.on{border-color:var(--leafG);background:color-mix(in srgb,var(--leafG) 18%,var(--card))}
.small{font-size:13px;color:var(--sub);margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{border:2px solid var(--line);border-radius:12px;padding:6px 4px}
.stats b{display:block;font-family:var(--display);font-weight:400;font-size:24px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--sub);font-weight:700}
.review{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.review li{border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
.review .rq{font-weight:700;margin-bottom:4px}
.review .ra{color:var(--good);font-weight:700}
.review .ry{color:var(--bad)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="app">
  <div class="hud" id="hud"></div>
  <div class="scene" id="scene"></div>
  <div class="talk"><div class="who" id="who"></div><div class="bubble" id="bubble"></div></div>
  <div id="view"></div>
</div>

<script>
/* ============ 題庫：c=關卡(1~5) ／ ox:a=true 代表○ ／ 選擇題 o[0] 一律是正解，出題時再洗牌 ============ */
const Q=[
/* ---- 第1關 駕訓班：標誌・標線・號誌 ---- */
{c:1,s:'stop',q:'看到這個紅色八角形標誌，應該怎麼做？',o:['停車再開：完全停住，確認安全再走','前方有停車場','減速慢行即可，不必停'],e:'紅色八角形「停」是「停車再開」標誌，車輪要完全停止，看清楚左右來車再通行。'},
{c:1,s:'yield',q:'這個倒三角形標誌的意思是？',o:['讓路：讓幹道或其他方向車輛先行','前方道路變窄','注意落石'],e:'倒三角形「讓」是讓路標誌，要減速或停車，讓另一方向的車先走。'},
{c:1,s:'noentry',q:'這個標誌的意思是？',o:['禁止車輛進入','前方施工','前方有單行道入口'],e:'紅色圓形中間一條白色橫槓是「禁止進入」，常見在單行道的出口端。'},
{c:1,s:'nopark',q:'藍底、紅框、一條斜線的標誌是？',o:['禁止停車（可以臨時停車）','禁止臨時停車','停車場'],e:'一條斜線＝禁止停車；畫成叉叉才是禁止臨時停車。'},
{c:1,s:'nostop',q:'藍底、紅框、打一個叉的標誌是？',o:['禁止臨時停車','禁止停車但可臨時停車','禁止迴車'],e:'叉叉＝連臨時停車（上下客貨）都不行。'},
{c:1,s:'speed50',q:'紅圈中間寫 50 的標誌是？',o:['最高速限每小時 50 公里','最低速限每小時 50 公里','建議時速 50 公里'],e:'紅圈數字是最高速限，車速不可超過標示的數字。'},
{c:1,s:'noleft',q:'這個標誌的意思是？',o:['禁止左轉','注意左彎','左側車道縮減'],e:'紅圈裡的左轉箭頭被紅色斜線劃掉，就是禁止左轉。'},
{c:1,s:'nouturn',q:'這個標誌的意思是？',o:['禁止迴車','前方有迴轉道','注意連續彎路'],e:'迴轉箭頭被劃掉＝禁止迴車。'},
{c:1,s:'warn',q:'正三角形、紅色外框的標誌，屬於哪一類？',o:['警告標誌','禁制標誌','指示標誌'],e:'台灣的警告標誌是正三角形紅框，提醒前方有危險或狀況（如彎路、學校、落石）。'},
{c:1,s:'straight',q:'藍底圓形、白色向上箭頭的標誌是？',o:['遵行方向：只准直行','建議直行','直行車道已滿'],e:'藍底圓形的是「遵行標誌」，一定要照箭頭方向走。'},
{c:1,s:'dblyellow',q:'道路中央畫了雙黃實線，代表？',o:['雙向禁止超車，不可跨越','可以安全超車','機車專用道'],e:'雙黃實線是雙向禁止超車線，兩個方向的車都不能跨越。'},
{c:1,s:'mixyellow',q:'中央分向線一邊實線、一邊虛線，哪一側的車不能跨越超車？',o:['靠實線那一側','靠虛線那一側','兩側都可以超車'],e:'單向禁止超車線：靠實線的那一側禁止跨越，靠虛線的一側可以在安全時超車。'},
{c:1,s:'redcurb',q:'路邊畫紅色實線，代表？',o:['禁止臨時停車','禁止停車，但可以臨時停車','計程車招呼站'],e:'紅線＝禁止臨時停車（停一下下也不行）。'},
{c:1,s:'yellowcurb',q:'路邊畫黃色實線，代表？',o:['禁止停車，但可以臨時停車','禁止臨時停車','可以停車'],e:'黃線＝禁止停車，但上下客貨、3 分鐘內能立刻開走的臨時停車可以。'},
{c:1,s:'whitesolid',q:'同向車道之間畫白色實線，代表？',o:['禁止變換車道','可以變換車道','機慢車專用'],e:'白實線是禁止變換車道線，常見在路口前和隧道內。'},
{c:1,t:'ox',s:'whitedash',q:'同向車道之間是白色虛線，可以在安全時打方向燈後變換車道。',a:true,e:'白虛線是車道線，確認安全、先打方向燈就能變換車道。'},
{c:1,s:'chevron',q:'路面畫了白色斜紋的槽化線，正確做法是？',o:['不可跨越行駛或停車','可以在上面臨時停車','塞車時可以開上去'],e:'槽化線用來引導車流，禁止跨越行駛。'},
{c:1,t:'ox',s:'flashyellow',q:'閃光黃燈表示：減速接近，注意安全，小心通過。',a:true,e:'閃光黃燈是警告號誌，不用停，但要減速注意。'},
{c:1,t:'ox',s:'flashred',q:'閃光紅燈表示減速即可通過，不必停車。',a:false,e:'閃光紅燈＝停車再開，要先停下來確認安全才走。'},
{c:1,t:'ox',s:'redlight',q:'在台灣，圓形紅燈亮時，只要沒有來車就可以直接右轉。',a:false,e:'台灣沒有「紅燈可右轉」的通則，除非該路口有標誌或右轉綠色箭頭允許。'},
{c:1,q:'黃燈亮起時，正確做法是？',o:['減速停在停止線前；若已太接近無法安全停下，才小心通過','趕快加速衝過去','原地緊急煞車'],e:'黃燈是要變紅燈的警告，原則上要停；已逼近停止線、急煞反而危險時才通過。'},

/* ---- 第2關 市區道路：行車規則・讓路・停車 ---- */
{c:2,q:'一般道路沒有速限標誌，也沒畫車道線和分向線時，最高時速是？',o:['30 公里','40 公里','50 公里'],e:'未劃設車道線、行車分向線或分向限制線的道路，時速不得超過 30 公里。'},
{c:2,q:'一般道路沒有速限標誌（有劃設車道線），汽車最高時速是？',o:['50 公里','60 公里','70 公里'],e:'沒有速限標誌或標線時，時速不得超過 50 公里。'},
{c:2,q:'汽車右轉時，應在距交岔路口多少公尺前打方向燈？',o:['30 公尺','10 公尺','5 公尺'],e:'轉彎要在距路口 30 公尺前就顯示方向燈。'},
{c:2,q:'準備右轉，應該先換到哪一個車道？',o:['外側（最右邊）車道','內側車道','任何車道都可以'],e:'右轉先換入外側車道、左轉先換入內側車道，不要在路口才硬切。'},
{c:2,q:'要超越前車，應從前車的哪一側超過？',o:['左側','右側','左右都可以'],e:'超車一律從左側，不可從右側超車。'},
{c:2,t:'ox',q:'超車時應顯示左方向燈，並與前車保持半公尺以上的間隔。',a:true,e:'超車要打左方向燈，與前車左側保持半公尺以上間隔，超過後保持安全距離再打右燈駛回。'},
{c:2,q:'無號誌路口，支線道車與幹線道車相遇時？',o:['支線道車讓幹線道車先行','幹線道車讓支線道車','誰先到誰先走'],e:'支線道讓幹線道、少線道讓多線道。'},
{c:2,q:'無號誌路口，兩車同為幹線道（或同為支線道）時？',o:['左方車讓右方車先行','右方車讓左方車先行','車子大的先走'],e:'同級道路相遇時，左方車讓右方車。'},
{c:2,q:'同一路口，轉彎車與直行車相遇時？',o:['轉彎車讓直行車先行','直行車讓轉彎車','按喇叭的先走'],e:'轉彎車要讓直行車先行。'},
{c:2,q:'駛入圓環時，應該？',o:['讓已在圓環內的車先行','圓環外的車優先','按喇叭搶先進入'],e:'進入圓環要讓已在環內行駛的車輛先行。'},
{c:2,t:'ox',q:'行人穿越道上有行人通行時，汽車應暫停讓行人先通過。',a:true,e:'行人優先！不停讓行人會被開罰並記點。'},
{c:2,t:'ox',q:'遇到持白手杖或有導盲犬引導的視障者，應暫停讓他先行。',a:true,e:'看到白手杖或導盲犬，一定要停車禮讓。'},
{c:2,q:'綠燈亮了，但路口另一頭車子塞住出不去，應該？',o:['停在停止線前等待，不要進入路口','先開進路口卡位','一直按喇叭'],e:'前方壅塞時不得進入路口，避免卡在路口阻擋橫向車流。'},
{c:2,q:'「臨時停車」的定義是？',o:['因上下客貨等原因暫停，未滿 3 分鐘且能立即開走','停車未滿 10 分鐘','只要引擎沒熄火都算'],e:'臨時停車：未滿 3 分鐘、駕駛人在車上能立即行駛。超過就是停車。'},
{c:2,q:'交岔路口幾公尺內不得臨時停車？',o:['10 公尺','5 公尺','3 公尺'],e:'交岔路口、公車招呼站 10 公尺內都不能臨時停車。'},
{c:2,q:'消防車出入口幾公尺內不得停車？',o:['5 公尺','1 公尺','20 公尺'],e:'消防車出入口 5 公尺內不得停車，消防栓前面也不行。'},
{c:2,t:'ox',q:'開車門前應先注意後方來車，確認安全才開門。',a:true,e:'建議用「荷蘭式開門」：用離門較遠的那隻手開門，身體自然轉向後方看。'},
{c:2,t:'ox',q:'汽車可以在單行道上倒車。',a:false,e:'單行道、交岔路口、隧道、橋樑、圓環、平交道都不得倒車。'},
{c:2,q:'下列哪一個地方不得迴車？',o:['橋樑上','寬敞、無禁止迴車標誌的雙向道路','停車場內'],e:'橋樑、隧道、圓環、彎道、坡道、單行道、平交道等處都不得迴車。'},

/* ============ 音效 ============ */
let actx=null, muted=false;
try{muted=localStorage.getItem('drvq_mute')==='1'}catch(e){}
function beep(seq){
  if(muted)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    let t=actx.currentTime;
    seq.forEach(([f,d,type='square'])=>{const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d);t+=d*.85});
  }catch(e){}
}
const SFX={ok:()=>beep([[880,.09],[1320,.16]]),ng:()=>beep([[220,.18,'sawtooth'],[160,.28,'sawtooth']]),clear:()=>beep([[523,.1],[659,.1],[784,.1],[1047,.3]]),over:()=>beep([[392,.2,'triangle'],[330,.2,'triangle'],[262,.5,'triangle']])};

/* ============ 狀態 ============ */
let S=null, best=0;
try{best=+localStorage.getItem('drvq_best')||0}catch(e){}
const $=id=>document.getElementById(id);

function newRun(){
  const qs=[];
  for(let st=1;st<=5;st++){
    shuffle(Q.map((q,i)=>i).filter(i=>Q[i].c===st)).slice(0,PER).forEach(i=>{
      const q=Q[i];
      if(q.t==='ox')qs.push({i,opts:['○','✕'],ans:q.a?0:1});
      else{const ord=shuffle([0,1,2].slice(0,q.o.length));qs.push({i,opts:ord.map(k=>q.o[k]),ans:ord.indexOf(0)})}
    });
  }
  return {mode:'q',qs,n:0,lives:LIVES,score:0,combo:0,maxCombo:0,right:0,wrong:[],picked:null};
}
const stageOf=n=>Math.floor(n/PER)+1;

/* ============ 畫面 ============ */
function hud(){
  const st=S&&S.mode!=='title'?Math.min(stageOf(S.n),5):0;
  const lives=Array.from({length:LIVES},(_,k)=>`<svg viewBox="0 0 20 26" class="${S&&k>=S.lives?'lost':''}" aria-hidden="true">${wakaba(0,0,1)}</svg>`).join('');
  $('hud').innerHTML=`<span class="chip">${st?`${st}/5・${STAGES[st].name}`:'駕照ヨシ！'}</span>`+
   (S?`<span class="lives" aria-label="剩下 ${S.lives} 條命">${lives}</span><span class="score" aria-label="分數">${S.score}</span>`:`<span class="score" aria-label="最高分">BEST ${best}</span>`)+
   `<button class="icon-btn" id="mute" aria-label="音效" aria-pressed="${muted}">${muted?'🔇':'🔊'}</button>`;
  $('mute').onclick=()=>{muted=!muted;try{localStorage.setItem('drvq_mute',muted?'1':'0')}catch(e){}hud()};
}
let lastScene=-1;
function setScene(st){if(st!==lastScene){$('scene').innerHTML=scene(st);lastScene=st}}
function say(mood,jp,zh,anim){
  $('who').innerHTML=chara(mood);
  const b=$('bubble');b.innerHTML=`<span class="jp">${jp}</span><span class="zh">${zh}</span>`;
  b.classList.remove('pop','shake');void b.offsetWidth;if(anim)b.classList.add(anim);
}

function title(){
  S=null;hud();setScene(0);

  $('view').innerHTML=`<div class="card">

function stageIntro(){
  const st=stageOf(S.n);S.mode='stage';hud();setScene(st);
  if(st>1)SFX.clear();
  say(st===5?'shock':'normal',STAGES[st].jp,`第 ${st} 關：${STAGES[st].name}`,'pop');
  $('view').innerHTML=`<div class="card">
   <div class="hero"><p>STAGE ${st} / 5</p><h1>${STAGES[st].name}</h1><p>${STAGES[st].sub}・${PER} 題</p></div>
   <div class="map">${STAGES.slice(1).map((s,k)=>`<span class="${k+1<=st?'on':''}">${s.name}</span>`).join('')}</div>
   <button class="big" id="go">出發！</button></div>`;
  $('go').onclick=()=>{S.mode='q';question()};
  $('go').focus();
}

function question(){
  const it=S.qs[S.n], q=Q[it.i], st=stageOf(S.n), k=S.n%PER;
  hud();setScene(st);
  if(S.picked===null)say('normal',rand(['どっちだ…？','落ち着いて','ここ、テストに出ます']),rand(['冷靜作答','想清楚再按','這題監理站很愛考']));
  const isOx=q.t==='ox';
  const opts=isOx
   ?`<div class="ox">${it.opts.map((o,j)=>`<button data-j="${j}" class="${j?'b':'m'}"><span class="g">${o}</span>${j?'錯誤':'正確'}</button>`).join('')}</div>`
   :`<div class="mc">${it.opts.map((o,j)=>`<button data-j="${j}"><span class="n">${j+1}</span><span>${o}</span></button>`).join('')}</div>`;
  $('view').innerHTML=`<div class="card" id="qc">
   <div class="meta"><span>第 ${k+1} / ${PER} 題・${isOx?'是非題':'選擇題'}</span><span>${STAGES[st].sub}</span></div>
   <div class="bar"><i style="width:${(S.n/(PER*5))*100}%"></i></div>
   ${q.s?`<div class="fig${WIDE.has(q.s)?' wide':''}">${SIGNS[q.s]}</div>`:''}
   <p class="q">${q.q}</p>${opts}<div id="fb"></div></div>`;
  document.querySelectorAll('#qc [data-j]').forEach(b=>b.onclick=()=>answer(+b.dataset.j));
  if(S.picked!==null)showResult(true);
}

function answer(j){
  if(S.picked!==null)return;
  S.picked=j;
  const it=S.qs[S.n], ok=j===it.ans;
  if(ok){S.right++;S.combo++;S.maxCombo=Math.max(S.maxCombo,S.combo);S.score+=100+Math.min(S.combo-1,5)*20;SFX.ok()}
  else{S.lives--;S.combo=0;S.wrong.push({i:it.i,you:it.opts[j],ans:it.opts[it.ans]});SFX.ng()}
  showResult(false);
}

function showResult(restored){
  const it=S.qs[S.n], q=Q[it.i], ok=S.picked===it.ans;
  document.querySelectorAll('#qc [data-j]').forEach(b=>{const j=+b.dataset.j;b.disabled=true;
    if(j===it.ans)b.classList.add('right');else if(j===S.picked)b.classList.add('wrong');else b.classList.add('dim')});
  const line=ok?rand(OK_LINES):rand(NG_LINES);
  if(!restored){
    if(ok)say('ok',line[0],line[1],'pop');
    else say(S.lives<=0?'dead':'ng',line[0],S.lives<=0?'若葉マーク全滅…':line[1],'shake');
  }
  hud();
  const last=S.lives<=0, endStage=(S.n+1)%PER===0;
  $('fb').innerHTML=`<div class="fb">
   <div class="verdict ${ok?'ok':'ng'}"><b>${ok?'○ 正解':'✕ 不正解'}</b><span>${ok?'答對了':'正確答案：'+it.opts[it.ans]}</span>${ok&&S.combo>=3?`<span class="combo">${S.combo} COMBO!!</span>`:''}</div>
   <p class="exp">${q.e}</p>
   <button class="big" id="next">${last?'看結果…':S.n+1>=S.qs.length?'領駕照！':endStage?'過關！下一關 →':'下一題 →'}</button></div>`;
  $('next').onclick=next;
  $('next').focus({preventScroll:true});
  $('fb').scrollIntoView({block:'nearest',behavior:'smooth'});
}

function next(){
  S.picked=null;
  if(S.lives<=0)return result(false);
  S.n++;
  if(S.n>=S.qs.length)return result(true);
  if(S.n%PER===0)return stageIntro();
  question();
}

function result(cleared){
  S.mode=cleared?'clear':'over';
  if(cleared&&!S.bonus){S.score+=S.lives*300;S.bonus=1}
  const nb=S.score>best;if(nb){best=S.score;try{localStorage.setItem('drvq_best',best)}catch(e){}}
  hud();setScene(cleared?5:Math.min(stageOf(S.n),5));
  if(cleared){SFX.clear();say('cool','計画通り','駕照 GET！所有路段制霸','pop')}
  else{SFX.over();say('dead','人生オワタ＼(^o^)／','在第 '+stageOf(S.n)+' 關翻車了…','shake')}
  const rev=S.wrong.map(w=>`<li><div class="rq">${Q[w.i].q}</div><div class="ry">你的答案：${w.you}</div><div class="ra">正確答案：${w.ans}</div><div>${Q[w.i].e}</div></li>`).join('');
  $('view').innerHTML=`<div class="card">
   <div class="hero"><p>${cleared?'ALL CLEAR':'GAME OVER'}</p><h1>${cleared?'駕照<em>GET</em>！':'吊銷<em>駕照</em>'}</h1><p>${cleared?'剩餘若葉マーク每片 +300 分':'到達第 '+stageOf(S.n)+' 關・'+STAGES[stageOf(S.n)].name}</p></div>
   <div class="stats"><div><b>${S.score}</b><span>${nb?'新紀錄！':'分數'}</span></div><div><b>${S.right}</b><span>答對題數</span></div><div><b>${S.maxCombo}</b><span>最大連擊</span></div></div>
   <div class="row"><button class="big" id="again">再挑戰（リトライ）</button><button class="big sec" id="home">回標題</button></div>
   ${rev?`<h2 class="small" style="font-weight:700">錯題複習（${S.wrong.length} 題）</h2><ul class="review">${rev}</ul>`:'<p class="small">全對！一題都沒錯，監理站考官也只能說ヨシ。</p>'}
  </div>`;
  $('again').onclick=()=>{S=newRun();stageIntro()};
  $('home').onclick=title;
  $('again').focus();
}

document.addEventListener('keydown',e=>{
  if(!S||S.mode!=='q'||S.picked!==null)return;
  const it=S.qs[S.n];const k=e.key.toLowerCase();
  let j=-1;
  if(Q[it.i].t==='ox'){if(k==='o')j=0;if(k==='x')j=1}
  if(/^[1-3]$/.test(k))j=+k-1;
  if(j>=0&&j<it.opts.length)answer(j);
});

/* 更新頁面時保留進行中的這一局 */
function start(data){
  if(data&&data.S&&data.S.qs){S=data.S;S.mode==='stage'?stageIntro():S.mode==='q'?question():result(S.mode==='clear')}
  else title();
}
try{window.claude?.hot?.snapshot?.(()=>({S}))}catch(e){}
const hot=window.claude?.hot;
hot?.ready?hot.ready(start):start(hot?.data??{});
</script>
</body>
</html>
